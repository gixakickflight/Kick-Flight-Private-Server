name: Deploy VPS (main)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      activate_ios_r52_profile:
        description: "One-way activation: serve the incomplete, test-only R52 iOS profile on Fenix"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: kick-flight-vps-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to VPS
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out main and recursive submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Require the pushed commit to still be main
        id: main_tip
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Ref is not main" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo "Checkout does not match event SHA" >&2; exit 1; }
          git fetch --quiet origin main
          latest_main="$(git rev-parse origin/main)"
          [[ "$latest_main" == "$GITHUB_SHA" ]] || {
            echo "Skipping stale main event; a newer main push will deploy the current tip"
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "deployable=true" >> "$GITHUB_OUTPUT"

      - name: Detect deployment components
        id: changes
        if: steps.main_tip.outputs.deployable == 'true'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          ACTIVATE_IOS_R52_PROFILE: ${{ inputs.activate_ios_r52_profile }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_EVENT_NAME" == workflow_dispatch && "$ACTIVATE_IOS_R52_PROFILE" == true ]]; then
            printf '%s\n' 'deploy=true' 'api=true' 'photon=false' 'cdn=false' 'farm=false' \
              'site=false' 'caddy=false' 'balance=false' 'full=false' 'r52_api_only=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            printf '%s\n' 'deploy=true' 'api=true' 'photon=true' 'cdn=true' 'farm=true' 'site=true' 'caddy=true' 'balance=true' 'full=true' 'r52_api_only=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - "$BEFORE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT" <<'PY'
          import subprocess
          import sys

          before, after = sys.argv[1:]
          changed = subprocess.check_output(["git", "diff", "--name-only", "-z", before, after]).decode().split("\0")
          changed = [path for path in changed if path]
          r52_api_only_paths = {
              ".github/workflows/deploy-vps-main.yml",
              "config/ios-r52-profile-release.json",
              "deploy/docker-compose.vps.yml",
              "docs/IOS_R52_PROFILE_RELEASE.md",
              "scripts/convert-android-model-to-ios.py",
              "scripts/deploy-vps-ci.sh",
              "scripts/ios-wire-floor.py",
              "scripts/run-model-batch.py",
              "scripts/stage-ios-r52-profile.py",
              "src/KickFlight.BootstrapApi/HarnessOptions.cs",
              "src/KickFlight.BootstrapApi/IosR52TestProfileStore.cs",
              "src/KickFlight.BootstrapApi/Program.cs",
              "src/KickFlight.BootstrapApi/ResourceCatalogStore.cs",
              "src/KickFlight.BootstrapApi/appsettings.json",
              "tests/KickFlight.BootstrapApi.Tests/IosR52ProfileRoutingTests.cs",
              "tests/test_convert_android_model_to_ios.py",
              "tests/test_ios_wire_floor.py",
              "tests/test_stage_ios_r52_profile.py",
          }
          if changed and set(changed).issubset(r52_api_only_paths) and any(
              path.startswith("src/KickFlight.BootstrapApi/") for path in changed
          ):
              print("deploy=true")
              print("api=true")
              for component in ("photon", "cdn", "farm", "site", "caddy", "balance", "full"):
                  print(f"{component}=false")
              print("r52_api_only=true")
              sys.exit(0)

          flags = {"deploy": False, "api": False, "photon": False, "cdn": False,
                   "farm": False, "site": False, "caddy": False, "balance": False,
                   "full": False, "r52_api_only": False}
          generators = {
              "scripts/build-cdn-tree.py", "scripts/build-title-resource-catalog.py",
              "scripts/build-title-resource-catalog.ps1", "scripts/build_kicker_catalog.py",
              "scripts/build_complete_catalog.py", "scripts/build-kicker-skin-thumbnail-bundles.py",
              "scripts/add_weapon_costume_aliases.py",
              "scripts/build-localize-bundles.py",
              "scripts/update-apk-catalog-sha.py",
          }
          artifact_flows = {
              "scripts/validate-apk-artifact.py",
              "scripts/set-apk-version.py",
          }
          for path in changed:
              if path == ".gitmodules":
                  flags["photon"] = True
              if path.startswith("src/") or path in {"Dockerfile", ".dockerignore", "Dockerfile.dockerignore"}:
                  flags["api"] = True
              if path.startswith("config/") or path.startswith("content/"):
                  flags["api"] = True
                  flags["full"] = True
              if path.startswith("content/") or path == "config/resources/catalog.json":
                  flags["farm"] = True
              if path == "submodules/luxonserver" or path.startswith("deploy/photon/"):
                  flags["photon"] = True
              if path.startswith("deploy/nginx/") or path == "deploy/nginx.vps.conf":
                  flags["cdn"] = True
              if path.startswith("deploy/site/"):
                  flags["site"] = True
              if path.startswith("deploy/caddy/"):
                  flags["caddy"] = True
              if path.startswith("tools/balance/") or path in {
                  "scripts/deploy-vps-ci.sh",
                  "scripts/ensure-balance-jwt-secret.sh",
                  "scripts/resolve-balance-jwt-secret-path.py",
              }:
                  flags["balance"] = True
              if path in {
                  "deploy/docker-compose.vps.yml", "deploy/docker-compose.vps.external-db.yml",
                  "deploy/nginx.grpc.vps.conf", "deploy/geoip/Dockerfile",
                  "scripts/deploy-vps-ci.sh",
              } or path.startswith("deploy/geoip/") or path.startswith("deploy/badges/") or path.startswith("tools/badges/"):
                  flags["full"] = True
              if path in generators:
                  flags["farm"] = True
                  flags["api"] = True
                  flags["full"] = True
              if path in artifact_flows:
                  flags["farm"] = True
                  flags["api"] = True
              if path in {"scripts/update-latest-information.py", "docs/updates-page.html", "tools/badges/prepare_announcement.py"} or path.startswith("docs/updates"):
                  flags["api"] = True
                  flags["site"] = True
              if path == "scripts/build-cdn-tree.py":
                  flags["cdn"] = True

          if flags["full"]:
              for component in ("api", "photon", "cdn", "site", "caddy", "balance", "farm"):
                  flags[component] = True
          flags["deploy"] = any(value for key, value in flags.items() if key != "deploy")
          for key, value in flags.items():
              print(f"{key}={'true' if value else 'false'}")
          PY

      - name: Stop when no deployed component changed
        if: steps.main_tip.outputs.deployable == 'true' && steps.changes.outputs.deploy != 'true'
        run: echo "No VPS runtime files changed; deployment skipped."

      - name: Package repository sources without runtime secrets or large sibling assets
        if: steps.main_tip.outputs.deployable == 'true' && steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/kf-vps-payload"
          mkdir -p "$payload/tree/submodules/luxonserver"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$payload/tree"
          rm -rf "$payload/tree/submodules/luxonserver"
          mkdir -p "$payload/tree/submodules/luxonserver"
          tar --exclude='.git' --exclude='*/.git' -C submodules/luxonserver -cf - . \
            | tar -xf - -C "$payload/tree/submodules/luxonserver"
          find "$payload/tree" -name '.env' -exec rm -rf -- {} +
          rm -rf "$payload/tree/.local" "$payload/tree/captures" "$payload/tree/logs" \
            "$payload/tree/certs" "$payload/tree/data/users" "$payload/tree/config/fixtures.local"
          find "$payload/tree" -type f -o -type l | sed "s#^$payload/tree/##" | sort > "$payload/tree/.kf-managed-files"
          tar -czf "$RUNNER_TEMP/kf-vps-release.tar.gz" -C "$payload/tree" .
          rm -rf "$payload"

      - name: Download and verify the optional iOS snapshot release asset
        id: ios_snapshot
        if: ${{ steps.main_tip.outputs.deployable == 'true' && steps.changes.outputs.deploy == 'true' && steps.changes.outputs.r52_api_only != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.activate_ios_r52_profile) }}
        shell: bash
        env:
          IOS_SNAPSHOT_RELEASE_TAG: ${{ vars.IOS_SNAPSHOT_RELEASE_TAG }}
          IOS_SNAPSHOT_ARCHIVE_SHA256: ${{ vars.IOS_SNAPSHOT_ARCHIVE_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$IOS_SNAPSHOT_RELEASE_TAG" && -z "$IOS_SNAPSHOT_ARCHIVE_SHA256" ]]; then
            python3 - src/KickFlight.BootstrapApi/catalog-ios-12346.json <<'PY'
          import json
          import pathlib
          import sys

          catalog = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          rows = catalog.get("resources")
          if not isinstance(rows, list) or not rows:
              raise SystemExit("iOS catalog has no resource rows")
          snapshots = {
              row["sourcePath"].split("/", 3)[2]
              for row in rows
              if isinstance(row, dict)
              and isinstance(row.get("sourcePath"), str)
              and row["sourcePath"].startswith(".local/ios-resources/")
          }
          if snapshots in ({"12346-r5"}, {"12346-r6"}, {"12346-r7"}):
              raise SystemExit("iOS catalog requires IOS_SNAPSHOT_RELEASE_TAG and IOS_SNAPSHOT_ARCHIVE_SHA256")
          PY
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$IOS_SNAPSHOT_RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "IOS_SNAPSHOT_RELEASE_TAG must be a tag in this repository's GitHub Releases" >&2; exit 1;
          }
          [[ "$IOS_SNAPSHOT_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "IOS_SNAPSHOT_ARCHIVE_SHA256 must be 64 lowercase hex characters" >&2; exit 1;
          }
          gh release download "$IOS_SNAPSHOT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern ios-resource-snapshot.tar.gz --dir "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/ios-resource-snapshot.tar.gz"
          echo "$IOS_SNAPSHOT_ARCHIVE_SHA256  $archive" | sha256sum --check --status || {
            echo "iOS snapshot archive SHA-256 does not match trusted repository variable" >&2; exit 1;
          }
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Download and verify the opt-in R52 iOS profile release asset
        id: ios_r52_profile
        if: steps.main_tip.outputs.deployable == 'true' && steps.changes.outputs.deploy == 'true' && github.event_name == 'workflow_dispatch' && inputs.activate_ios_r52_profile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - config/ios-r52-profile-release.json "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import re
          import sys

          config = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schemaVersion": 1, "assetVersion": 12346, "revisionFloor": 52,
              "testOnly": True, "complete": False,
              "runtimeContract": "kickflight.ios-r52-test-profile.v1",
          }
          if any(config.get(key) != value for key, value in expected.items()):
              raise SystemExit("R52 release pin does not describe the reviewed test-only profile")
          tag, asset, digest = (config.get("releaseTag"), config.get("assetName"), config.get("archiveSha256"))
          if not isinstance(tag, str) or not re.fullmatch(r"[A-Za-z0-9._-]+", tag):
              raise SystemExit("R52 release tag is invalid")
          if asset != "ios-r52-profile.tar.gz" or not isinstance(digest, str) or not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("R52 release asset pin is invalid")
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\nasset={asset}\nsha256={digest}\n")
          PY
          # Read the just-validated public pin without exposing any repository secrets.
          pin_tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          pin_asset="$(sed -n 's/^asset=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          pin_sha="$(sed -n 's/^sha256=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          gh release download "$pin_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$pin_asset" --dir "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/$pin_asset"
          python3 scripts/stage-ios-r52-profile.py validate --archive "$archive" --archive-sha256 "$pin_sha"
          {
            echo "enabled=true"
            echo "archive=$archive"
            echo "sha256=$pin_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Set up .NET 8 for opt-in R52 runtime validation
        if: steps.ios_r52_profile.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Stage the exact R52 package for routing tests
        id: ios_r52_test_profile
        if: steps.ios_r52_profile.outputs.enabled == 'true'
        shell: bash
        env:
          R52_ARCHIVE: ${{ steps.ios_r52_profile.outputs.archive }}
          R52_ARCHIVE_SHA256: ${{ steps.ios_r52_profile.outputs.sha256 }}
        run: |
          set -euo pipefail
          stage_root="$RUNNER_TEMP/ios-r52-test-stage"
          python3 scripts/stage-ios-r52-profile.py stage \
            --archive "$R52_ARCHIVE" --archive-sha256 "$R52_ARCHIVE_SHA256" \
            --stage-root "$stage_root"
          echo "profile=$stage_root/12346-r52/profile" >> "$GITHUB_OUTPUT"

      - name: Run R52 API routing test against all staged payloads
        if: steps.ios_r52_profile.outputs.enabled == 'true'
        shell: bash
        env:
          KF_R52_REVIEW_PROFILE: ${{ steps.ios_r52_test_profile.outputs.profile }}
        run: |
          set -euo pipefail
          dotnet test tests/KickFlight.BootstrapApi.Tests/KickFlight.BootstrapApi.Tests.csproj \
            --filter FullyQualifiedName~R52_review_package_is_accepted_when_profile_path_is_set \
            --verbosity minimal

      - name: Configure pinned SSH host verification
        if: steps.main_tip.outputs.deployable == 'true' && steps.changes.outputs.deploy == 'true'
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_PRIVATE_KEY" ]] || { echo "Missing secret VPS_SSH_PRIVATE_KEY" >&2; exit 1; }
          [[ -n "$VPS_KNOWN_HOSTS" ]] || { echo "Missing secret VPS_KNOWN_HOSTS" >&2; exit 1; }
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/kf-vps-deploy-key"
          chmod 600 "$RUNNER_TEMP/kf-vps-deploy-key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/kf-vps-known-hosts"
          chmod 600 "$RUNNER_TEMP/kf-vps-known-hosts"
          known_host="$VPS_HOST"
          if [[ -n "$VPS_SSH_PORT" && "$VPS_SSH_PORT" != 22 ]]; then
            known_host="[$VPS_HOST]:$VPS_SSH_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$RUNNER_TEMP/kf-vps-known-hosts" >/dev/null || {
            echo "VPS_KNOWN_HOSTS does not contain the configured VPS_HOST" >&2
            exit 1
          }

      # Stage the immutable APK before the deployment can activate catalog links or the Android minimum.
      - name: Stage Android 2.11.5 release APK if configured in catalog
        id: android_apk
        if: ${{ steps.main_tip.outputs.deployable == 'true' && steps.changes.outputs.deploy == 'true' && steps.changes.outputs.r52_api_only != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.activate_ios_r52_profile) }}
        shell: bash
        env:
          ANDROID_RELEASE_TAG: android-2.11.5
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/android_apk_info.env"
          import json
          import re
          import sys

          catalog = json.load(open("config/resources/catalog.json", encoding="utf-8"))
          rows = [r for r in catalog.get("resources", [])
                  if isinstance(r, dict) and r.get("id") == "apk-remote-2115" and r.get("enabled", True)]
          if not rows:
              print("APK_CONFIGURED=false")
              sys.exit(0)

          row = rows[0]
          sha = str(row.get("sha256", "")).strip().lower()
          if not re.fullmatch(r"[0-9a-f]{64}", sha) or set(sha) == {"0"}:
              sys.exit("apk-remote-2115 sha256 is invalid or placeholder")

          source_path = row.get("sourcePath", "")
          if source_path != ".local/KickFlight-2.11.5-remote.apk":
              sys.exit(f"apk-remote-2115 unexpected sourcePath: {source_path}")

          filename = source_path.split("/")[-1]
          print("APK_CONFIGURED=true")
          print(f"APK_SHA256={sha}")
          print(f"APK_SOURCE_PATH={source_path}")
          print(f"APK_FILENAME={filename}")
          PY

          source "$RUNNER_TEMP/android_apk_info.env"
          if [[ "$APK_CONFIGURED" != "true" ]]; then
            echo "apk-remote-2115 is not configured or enabled in catalog.json; skipping Android artifact staging."
            exit 0
          fi

          [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_APP_DIR" ]] || {
            echo "Set repository variables VPS_HOST, VPS_USER, and VPS_APP_DIR" >&2
            exit 1
          }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "VPS_HOST contains unsupported characters" >&2; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "VPS_USER contains unsupported characters" >&2; exit 1; }
          [[ "$VPS_APP_DIR" == /* ]] || { echo "VPS_APP_DIR must be absolute" >&2; exit 1; }
          port="${VPS_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] || { echo "VPS_SSH_PORT must be numeric" >&2; exit 1; }

          remote="${VPS_USER}@${VPS_HOST}"
          ssh_opts=(-i "$RUNNER_TEMP/kf-vps-deploy-key" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kf-vps-known-hosts")
          scp_opts=(-i "$RUNNER_TEMP/kf-vps-deploy-key" -P "$port" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kf-vps-known-hosts")

          remote_status=$(ssh "${ssh_opts[@]}" "$remote" bash -s -- "$VPS_APP_DIR" "$APK_SOURCE_PATH" "$APK_SHA256" <<'REMOTE_CHECK'
          set -euo pipefail
          app_dir=$1
          source_path=$2
          expected_sha=$3
          target="$app_dir/$source_path"
          if [[ ! -f "$target" ]]; then
            echo "missing"
          elif echo "$expected_sha  $target" | sha256sum --check --status 2>/dev/null; then
            echo "match"
          else
            echo "mismatch"
          fi
          REMOTE_CHECK
          )

          if [[ "$remote_status" == "match" ]]; then
            echo "Verified $APK_FILENAME already exists on remote VPS with exact SHA-256 ($APK_SHA256); avoiding re-download and re-upload."
            exit 0
          elif [[ "$remote_status" == "mismatch" ]]; then
            echo "ERROR: Conflicting $APK_FILENAME already exists on remote VPS with different SHA-256; refusing to overwrite immutable release artifact." >&2
            exit 1
          fi

          echo "Downloading $APK_FILENAME from release tag $ANDROID_RELEASE_TAG..."
          gh release download "$ANDROID_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_FILENAME" --dir "$RUNNER_TEMP"
          local_apk="$RUNNER_TEMP/$APK_FILENAME"
          [[ -f "$local_apk" ]] || { echo "Downloaded APK $local_apk not found" >&2; exit 1; }

          echo "Verifying SHA-256 of downloaded APK..."
          echo "$APK_SHA256  $local_apk" | sha256sum --check --status || {
            echo "Downloaded APK SHA-256 does not match catalog row apk-remote-2115" >&2
            rm -f -- "$local_apk"
            exit 1
          }

          echo "Running focused artifact validation..."
          python3 scripts/validate-apk-artifact.py "$local_apk" --expected-sha256 "$APK_SHA256"

          remote_staging="$VPS_APP_DIR/.local/.${APK_FILENAME}.staging-${GITHUB_SHA}"
          echo "Uploading $APK_FILENAME to temporary staging location on VPS..."
          scp "${scp_opts[@]}" "$local_apk" "$remote:$remote_staging"
          rm -f -- "$local_apk"

          echo "Atomically installing $APK_FILENAME into $VPS_APP_DIR/.local/ on VPS..."
          ssh "${ssh_opts[@]}" "$remote" bash -s -- "$VPS_APP_DIR" "$APK_SOURCE_PATH" "$remote_staging" "$APK_SHA256" <<'REMOTE_INSTALL'
          set -euo pipefail
          app_dir=$1
          source_path=$2
          staging_file=$3
          expected_sha=$4

          target="$app_dir/$source_path"
          target_dir=$(dirname -- "$target")
          mkdir -p "$target_dir"

          trap 'rm -f -- "$staging_file"' EXIT ERR

          if [[ -f "$target" ]] && ! echo "$expected_sha  $target" | sha256sum --check --status 2>/dev/null; then
            echo "ERROR: Immutability violation - conflicting artifact exists at $target" >&2
            exit 1
          fi

          echo "$expected_sha  $staging_file" | sha256sum --check --status || {
            echo "Remote staged APK SHA-256 verification failed" >&2
            exit 1
          }

          mv -f -- "$staging_file" "$target"
          chmod 644 "$target"
          echo "Installed $target on VPS successfully."
          trap - EXIT ERR
          REMOTE_INSTALL

      - name: Upload release and deploy selected services on the VPS
        if: steps.main_tip.outputs.deployable == 'true' && steps.changes.outputs.deploy == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          DEPLOY_API: ${{ steps.changes.outputs.api }}
          DEPLOY_PHOTON: ${{ steps.changes.outputs.photon }}
          DEPLOY_CDN: ${{ steps.changes.outputs.cdn }}
          REBUILD_FARM: ${{ steps.changes.outputs.farm }}
          SYNC_SITE: ${{ steps.changes.outputs.site }}
          DEPLOY_CADDY: ${{ steps.changes.outputs.caddy }}
          DEPLOY_BALANCE: ${{ steps.changes.outputs.balance }}
          FULL_DEPLOY: ${{ steps.changes.outputs.full }}
          IOS_SNAPSHOT_ENABLED: ${{ steps.ios_snapshot.outputs.enabled }}
          IOS_SNAPSHOT_ARCHIVE: ${{ steps.ios_snapshot.outputs.archive }}
          IOS_SNAPSHOT_ARCHIVE_SHA256: ${{ vars.IOS_SNAPSHOT_ARCHIVE_SHA256 }}
          IOS_R52_PROFILE_REQUESTED: ${{ steps.ios_r52_profile.outputs.enabled || 'false' }}
          IOS_R52_PROFILE_ARCHIVE: ${{ steps.ios_r52_profile.outputs.archive }}
          IOS_R52_PROFILE_ARCHIVE_SHA256: ${{ steps.ios_r52_profile.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_APP_DIR" ]] || {
            echo "Set repository variables VPS_HOST, VPS_USER, and VPS_APP_DIR" >&2
            exit 1
          }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "VPS_HOST contains unsupported characters" >&2; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "VPS_USER contains unsupported characters" >&2; exit 1; }
          [[ "$VPS_APP_DIR" == /* ]] || { echo "VPS_APP_DIR must be absolute" >&2; exit 1; }
          port="${VPS_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] || { echo "VPS_SSH_PORT must be numeric" >&2; exit 1; }
          remote="${VPS_USER}@${VPS_HOST}"
          remote_archive="/tmp/kf-vps-${GITHUB_SHA}.tar.gz"
          ssh_opts=(-i "$RUNNER_TEMP/kf-vps-deploy-key" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kf-vps-known-hosts")
          scp_opts=(-i "$RUNNER_TEMP/kf-vps-deploy-key" -P "$port" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/kf-vps-known-hosts")
          scp "${scp_opts[@]}" "$RUNNER_TEMP/kf-vps-release.tar.gz" "$remote:$remote_archive"
          remote_ios_archive=""
          ios_archive_arg="-"
          ios_sha_arg="-"
          if [[ "$IOS_SNAPSHOT_ENABLED" == true ]]; then
            remote_ios_archive="/tmp/kf-ios-snapshot-${GITHUB_SHA}.tar.gz"
            scp "${scp_opts[@]}" "$IOS_SNAPSHOT_ARCHIVE" "$remote:$remote_ios_archive"
            printf -v ios_archive_arg '%q' "$remote_ios_archive"
            printf -v ios_sha_arg '%q' "$IOS_SNAPSHOT_ARCHIVE_SHA256"
          fi
          remote_ios_r52_archive=""
          r52_archive_arg="-"
          r52_sha_arg="-"
          if [[ "$IOS_R52_PROFILE_REQUESTED" == true ]]; then
            [[ -f "$IOS_R52_PROFILE_ARCHIVE" && "$IOS_R52_PROFILE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
              echo "R52 profile archive or pinned SHA-256 is missing" >&2; exit 1;
            }
            remote_ios_r52_archive="/tmp/kf-ios-r52-profile-${GITHUB_SHA}.tar.gz"
            scp "${scp_opts[@]}" "$IOS_R52_PROFILE_ARCHIVE" "$remote:$remote_ios_r52_archive"
            printf -v r52_archive_arg '%q' "$remote_ios_r52_archive"
            printf -v r52_sha_arg '%q' "$IOS_R52_PROFILE_ARCHIVE_SHA256"
          fi
          printf -v q_app '%q' "$VPS_APP_DIR"
          printf -v q_archive '%q' "$remote_archive"
          # The SHA argument is also the release tag: deploy-vps-ci.sh exports it as KF_RELEASE_SHA into the
          # compose environment, and the API records it in the ops telemetry's server_runs on every start.
          printf -v q_sha '%q' "$GITHUB_SHA"
          ssh "${ssh_opts[@]}" "$remote" \
            "bash -s -- $q_app $q_sha $q_archive '$DEPLOY_API' '$DEPLOY_PHOTON' '$DEPLOY_CDN' '$REBUILD_FARM' '$SYNC_SITE' '$DEPLOY_CADDY' '$FULL_DEPLOY' '$DEPLOY_BALANCE' $ios_archive_arg $ios_sha_arg $r52_archive_arg $r52_sha_arg '$IOS_R52_PROFILE_REQUESTED'" \
            < scripts/deploy-vps-ci.sh
          ssh "${ssh_opts[@]}" "$remote" "rm -f -- '$remote_archive'"
          if [[ -n "$remote_ios_archive" ]]; then
            ssh "${ssh_opts[@]}" "$remote" "rm -f -- '$remote_ios_archive'"
          fi
          if [[ -n "$remote_ios_r52_archive" ]]; then
            ssh "${ssh_opts[@]}" "$remote" "rm -f -- '$remote_ios_r52_archive'"
          fi
