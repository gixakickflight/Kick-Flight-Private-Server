  }
}

function select(tab, id) {
  state.tab = tab;
  state.selection[tab] = id;
  renderList();
  renderPanel();
}

/* ------------------------------------------------------------------- panel */

function canEditRows(table) {
  return !!(state.effectSchema && state.effectSchema[table]);
}

/* Badge + "Revert to base" shown on every section whose table has an override file. */
function appendOverrideControls(head, table) {
  if (!isOverridden(table)) return;
  head.appendChild(el("span", { class: "chip ovr" }, BalanceI18n.t("kickerPanel.overridden")));
  const button = el("button", { type: "button", class: "mini rev" }, BalanceI18n.t("kickerPanel.revertTable"));
  button.title = "masters_" + table + ".json";
  button.addEventListener("click", function () {
    const isEs = BalanceI18n.getLang() === "es";
    const msg = isEs
      ? "¿Revertir masters_" + table + ".json al archivo base?\n\nEsto elimina la modificación (se guarda una copia). La API seguirá usando los valores modificados hasta que la reinicies."
      : "Revert masters_" + table + ".json to the base config file?\n\nThis deletes the override file (a backup is kept). The API keeps serving the tuned values until you restart it.";
    if (window.confirm(msg)) {
      revertTable(table);
    }
  });
  head.appendChild(button);
}

async function revertTable(table) {
  if (state.saving) return;
  state.saving = true;
  refreshDirty();
  setStatus([["info", "reverting masters_" + table + ".json to base ..."]]);
  try {
    const body = await fetchJSON("/api/table/" + table + "/revert", {
      method: "POST",
      headers: { "Content-Type": "application/json" }
    });
    if (!body || body.ok !== true) throw new Error("unexpected response");
    await loadTable(table, true);
    state.pristine[table] = JSON.parse(JSON.stringify(state.data[table]));
    await loadOverrides();
    await loadApplyStatus();
    buildScreens();
    renderPanel();
    setStatus([["ok", "masters_" + table + ".json reverted to the base config file"]]);
  } catch (error) {
    setStatus([["err", "revert failed: " + error.message]]);
  }
  state.saving = false;
  refreshDirty();
}

function makeSection(title, table, rows, options) {
  const opts = options || {};
  const adds = opts.addable && canEditRows(table) &&
    opts.linkField && opts.linkValue !== null && opts.linkValue !== undefined;
  const section = el("section", { class: "sec" + (opts.nested ? " nested" : "") });
  const head = el("h2");
  head.appendChild(el("span", { class: "t" }, title));
  head.appendChild(el("code", { class: "src" }, "masters_" + table + ".json"));
  head.appendChild(el("span", { class: "grow" }));
  appendOverrideControls(head, table);
  if (adds) {
    const button = el("button", { type: "button", class: "mini add" }, BalanceI18n.t("kickerPanel.addRow"));
    button.title = BalanceI18n.t("kickerPanel.addRowTitle", { table: table, link: opts.linkField, val: opts.linkValue });
    button.addEventListener("click", function () { addEffectRow(table, opts.linkField, opts.linkValue); });
    head.appendChild(button);
  }
  section.appendChild(head);

  if (!Array.isArray(rows)) {
    section.appendChild(el("p", { class: "note" }, "could not load this table"));
    return section;
  }
  if (!rows.length) {
    section.appendChild(el("p", { class: "note" }, opts.empty || "no rows for this selection"));
    return section;
  }
  for (const row of rows) {
    section.appendChild(renderRow(table, row, {
      deletable: !!opts.deletable,
      fieldGuidance: !!opts.fieldGuidance
    }));
  }
  return section;
}

function renderRow(table, row, options) {
  const opts = options || {};
  const wrap = el("div", { class: "row" });
  const head = el("div", { class: "rowhead" });
  for (const key of Object.keys(row)) {
    if (!LINK_FIELDS.has(key)) continue;
    const chip = el("span", { class: "chip" });
    chip.appendChild(document.createTextNode(key + " "));
    chip.appendChild(el("b", null, formatValue(row[key])));
    head.appendChild(chip);
  }
  if (opts.deletable) {
    head.appendChild(el("span", { class: "spacer" }));
    const button = el("button", { type: "button", class: "mini del" }, "✕ " + BalanceI18n.t("kickerPanel.deleteRow"));
    button.title = BalanceI18n.t("kickerPanel.deleteRowTitle");
    button.addEventListener("click", function () {
      const isEs = BalanceI18n.getLang() === "es";
      const msg = isEs ? ("¿Eliminar fila id " + row.id + " de masters_" + table + ".json?") : ("Delete row id " + row.id + " from masters_" + table + ".json?");
      if (window.confirm(msg)) {
        deleteEffectRow(table, row.id);
      }
    });
    head.appendChild(button);
  }
  if (head.childNodes.length) wrap.appendChild(head);

  const grid = el("div", { class: "grid" });
  for (const key of Object.keys(row)) {
    if (LINK_FIELDS.has(key)) continue;
    grid.appendChild(renderField(table, row, key, row[key], opts.fieldGuidance));
  }
  wrap.appendChild(grid);
  return wrap;
}

function renderField(table, row, key, value, fieldGuidance) {
  const isEs = BalanceI18n.getLang() === "es";
  const mode = fieldMode(table, key, value);
  const verifiedGuidance = fieldGuidance ? DISC_FIELD_GUIDANCE[table + "." + key] : null;
  const useGuidance = !!verifiedGuidance || (!!fieldGuidance && mode !== "readonly");
  const guidance = verifiedGuidance || (useGuidance ? [
    key, key,
    "No verified field-specific explanation is available for this value. The panel preserves the raw master key and value; check the source master documentation before changing it.",
    "No hay una explicación verificada para este campo. El panel conserva la clave y el valor originales; consulta la documentación de los maestros antes de cambiarlo."
  ] : null);
  const label = el(useGuidance ? "div" : "label", {
    class: (useGuidance ? "field-guided " : "field ") + mode
  });
  let inputId = "";
  if (useGuidance) {
    inputId = "disc-field-" + table + "-" + row.id + "-" + key;
    const friendlyName = isEs ? guidance[1] : guidance[0];
    const helpCopy = isEs ? guidance[3] : guidance[2];
    const valueLabel = isEs ? "Valor" : "Value";
    const heading = el("div", { class: "k" });
    const friendlyName = isEs ? guidance[1] : guidance[0];
    heading.appendChild(el("span", { class: "friendly-name" }, friendlyName));
    heading.appendChild(el("code", { class: "raw-name" }, key));
    const details = el("details", { class: "field-help" });
    const summary = el("summary", { "aria-label": (isEs ? "Ayuda: " : "Help: ") + friendlyName }, "?");
    const copy = el("div", { class: "help-copy" });
    copy.appendChild(el("p", null, isEs ? guidance[3] : guidance[2]));
    details.append(summary, copy);
    heading.appendChild(details);
    label.appendChild(heading);
  } else {
    label.appendChild(el("span", { class: "k" }, key));
  }

  const valueLabelText = isEs ? "Valor" : "Value";
  const enabledLabelText = isEs ? "Activado" : "Enabled";

  if (mode === "number") {
    const inputAttrs = { type: "number", step: "any", value: formatValue(value) };
    if (useGuidance) inputAttrs.id = inputId;
    const input = el("input", inputAttrs);
    if (useGuidance) input.setAttribute("aria-label", (isEs ? guidance[1] : guidance[0]) + " — " + valueLabelText);
    input.dataset.table = table;
    input.dataset.rowId = String(row.id);
    input.dataset.field = key;
    if (typeof value === "number" && Number.isInteger(value)) input.dataset.int = "1";
    input.addEventListener("input", onFieldInput);
    state.inputs.set(fieldKey(table, row.id, key), input);
    if (useGuidance) label.appendChild(el("label", { for: inputId }, valueLabelText));
    label.appendChild(input);
    return label;
  }
  if (mode === "enum") {
    /* Named dropdown: options are "<id> - <member name>". The stored value stays the raw
       integer. A current value the registry does not know keeps its own option, so it is
       shown and preserved (never silently changed to a known value). */
    const values = enumValues(enumNameFor(table, key)) || {};
    const select = el("select", useGuidance ? { id: inputId } : null);
    if (useGuidance) select.setAttribute("aria-label", (isEs ? guidance[1] : guidance[0]) + " — " + valueLabelText);
    const current = Number(value);
    const ids = Object.keys(values).map(Number).filter(function (id) {
      return Number.isFinite(id);
    }).sort(function (a, b) { return a - b; });
    let known = false;
    for (const id of ids) {
      if (id === current) known = true;
      select.appendChild(el("option", { value: String(id) }, id + " - " + values[String(id)]));
    }
    const unknownText = isEs ? "(desconocido)" : "(unknown)";
    if (!known) select.appendChild(el("option", { value: String(current) }, formatValue(value) + " - " + unknownText));
    select.value = String(current);
    select.dataset.table = table;
    select.dataset.rowId = String(row.id);
    select.dataset.field = key;
    select.dataset.int = "1";
    select.addEventListener("change", onFieldInput);
    state.inputs.set(fieldKey(table, row.id, key), select);
    if (useGuidance) label.appendChild(el("label", { for: inputId }, valueLabelText));
    label.appendChild(select);
    return label;
  }
  if (mode === "bool") {
    const inputAttrs = { type: "checkbox" };
    if (useGuidance) inputAttrs.id = inputId;
    const input = el("input", inputAttrs);
    if (useGuidance) input.setAttribute("aria-label", (isEs ? guidance[1] : guidance[0]) + " — " + enabledLabelText);
    input.checked = value === true;
    input.dataset.table = table;
    input.dataset.rowId = String(row.id);
    input.dataset.field = key;
    input.addEventListener("change", onFieldInput);
    state.inputs.set(fieldKey(table, row.id, key), input);
    if (useGuidance) label.appendChild(el("label", { for: inputId }, enabledLabelText));
    label.appendChild(input);
    return label;
  }
  const isText = typeof value === "string" && value.length > 24;
  label.appendChild(el("span", { class: "ro" + (isText ? " wrap" : "") }, formatValue(value)));
  return label;
}

function findRow(table, rowId) {
  const rows = rowsOf(table);
  for (const row of rows) {
    if (String(row.id) === String(rowId)) return row;
  }
  return null;
}

function nextEffectId(table) {
  let maxId = 0;
  for (const row of rowsOf(table)) {
    if (typeof row.id === "number" && row.id > maxId) maxId = row.id;
  }
  return maxId + 1;   /* fresh against every row currently in the table */
}

function addEffectRow(table, linkField, linkValue) {
  const schema = state.effectSchema[table];
  if (!schema) return;
  const row = {};
  row.id = nextEffectId(table);
  row[linkField] = linkValue;
  const defaults = schema.defaults || {};
  const fields = schema.fields || {};
  for (const key of Object.keys(fields)) {
    if (key === "id" || key === linkField) continue;
    if (Object.prototype.hasOwnProperty.call(defaults, key)) {
      row[key] = defaults[key];
    } else {
      const kind = fields[key];
      row[key] = kind === "bool" ? false : kind === "str" ? "" : 0;
    }
  }
  const rows = rowsOf(table);
  rows.push(row);
  state.data[table] = rows;
  refreshDirty();
  renderPanel();
}

function deleteEffectRow(table, rowId) {
  state.data[table] = rowsOf(table).filter(function (row) { return String(row.id) !== String(rowId); });
  refreshDirty();
  renderPanel();
}

function onFieldInput(event) {
  const input = event.target;
  const table = input.dataset.table;
  const key = input.dataset.field;
  const row = findRow(table, input.dataset.rowId);
  if (!row) return;

  if (input.type === "checkbox") {
    row[key] = input.checked;
    delete input.dataset.invalid;
  } else if (input.value === "") {
    /* Kept as NaN so the field counts as changed; JSON.stringify turns it into
       null and the server rejects it with a readable message. */
    row[key] = NaN;
    input.dataset.invalid = "1";
  } else {
    const number = Number(input.value);
    row[key] = number;
    const wantsInt = input.dataset.int === "1";
    if (!Number.isFinite(number) || (wantsInt && !Number.isInteger(number))) {
      input.dataset.invalid = "1";
    } else {
      delete input.dataset.invalid;
    }
  }
  refreshDirty();
}

function renderPanel() {
  const panel = document.getElementById("panel");
  state.inputs.clear();
  clear(panel);
  if (state.tab === "maintenance") {
    renderMaintenancePanel(panel);
    return;
  }
  if (state.tab === "client-update") {
    renderClientUpdatePanel(panel);
    return;
  }
  if (state.tab === "latest-information") {
    renderLatestInformationPanel(panel);
    return;
  }
  if (state.tab === "health") {
    renderHealthPanel(panel);
    return;
  }
  if (state.tab === "bot-ai") {
    renderBotAiPanel(panel);
    return;
  }
  if (state.tab === "text") {
    const name = state.selection.text;
    const screen = state.screens.filter(function (sc) { return sc.name === name; })[0];
    if (!screen) {
      panel.appendChild(el("p", { class: "empty" }, "Select a screen from the list. Boxes are the LocalizeText elements of that " +
        "UI prefab (approximate: layout groups and scroll lists are not simulated); edit the text on the right and it updates live."));
      return;
    }
    renderTextPanel(panel, screen);
    return;
  }
  if (state.tab === "kickers") {
    const id = state.selection.kickers;
    if (id === null) {
      panel.appendChild(el("p", { class: "empty" }, "Select a kicker from the list."));
      return;
    }
    const kicker = state.kickers.filter(function (k) { return k.id === id; })[0];
    if (kicker) renderKickerPanel(panel, kicker);
    return;
  }
  const id = state.selection.discs;
  if (id === null) {
    panel.appendChild(el("p", { class: "empty" }, "Select a disc from the list."));
    return;
  }
  const disc = state.discs.filter(function (d) { return d.id === id; })[0];
  if (disc) renderDiscPanel(panel, disc);
}

function renderKickerPanel(panel, kicker) {
  const parameter = rowsOf("kicker_parameter").filter(function (r) { return r.kickerId === kicker.id; })[0];
  const role = parameter ? parameter.roleType : null;
  const weapon = parameter ? parameter.weaponType : null;
  const skillId = parameter ? parameter.skillId : null;
  panel.appendChild(panelHeader("kicker", kicker.id,
    kicker.name,
    "id " + kicker.id + " · roleType " + role + " · weaponType " + weapon + " · KS skillId " + skillId));

  /* Stats */
  panel.appendChild(makeSection("Stats", "kicker_parameter",
    rowsOf("kicker_parameter").filter(function (r) { return r.kickerId === kicker.id; }),
    { empty: "no kicker_parameter row for this kicker" }));

  /* Passive */
  const abilities = rowsOf("kicker_ability").filter(function (r) { return r.kickerId === kicker.id; });
  panel.appendChild(makeSection("Passive", "kicker_ability", abilities,
    { empty: "no kicker_ability row for this kicker" }));
  const abilityIds = abilities.map(function (r) { return r.id; });
  const abilityConditions = rowsOf("kicker_ability_condition").filter(function (r) {
    return abilityIds.indexOf(r.kickerAbilityId) !== -1;
  });
  if (abilityConditions.length) {
    panel.appendChild(makeSection("Passive condition", "kicker_ability_condition", abilityConditions));
  }
  /* A passive whose `value` is a skill id (Jay's bat bomb: BatAbilityParameter reads value as the trap skill,
     40001) gets that skill and its extra rows too - that is where the blast radius / fuse / lifetime / effect
     (skill_trap: radius, duration, interval, effectPath) and the damage coefficient (skill.coefficient) live. */
  for (const ability of abilities) {
    const passiveSkillId = Number.isInteger(ability.value) && ability.value >= 10000 ? ability.value : null;
    const passiveSkill = passiveSkillId === null ? [] :
      rowsOf("skill").filter(function (r) { return r.id === passiveSkillId; });
    if (!passiveSkill.length) continue;
    panel.appendChild(makeSection("Passive skill · " + passiveSkillId, "skill", passiveSkill));
    for (const table of KS_EXTRA_TABLES) {
      const rows = rowsOf(table).filter(function (r) { return r.skillId === passiveSkillId; });
      panel.appendChild(makeSection("Passive skill extra · " + table, table, rows, {
        addable: true, deletable: true, linkField: "skillId", linkValue: passiveSkillId,
        empty: "no " + table + " rows for skillId " + passiveSkillId
      }));
    }
  }

  /* Kicker skill + its extra rows */
  const skillRows = skillId === null ? [] :
    rowsOf("skill").filter(function (r) { return r.id === skillId; });
  panel.appendChild(makeSection("Kicker Skill", "skill", skillRows,
    { empty: "no masters_skill row for skillId " + skillId }));
  for (const table of KS_EXTRA_TABLES) {
    const rows = rowsOf(table).filter(function (r) { return r.skillId === skillId; });
    panel.appendChild(makeSection("Kicker Skill extra · " + table, table, rows, {
      addable: true, deletable: true, linkField: "skillId", linkValue: skillId,
      empty: "no " + table + " rows for this kicker skill"
    }));
  }

  /* Special skill + extras */
  const specials = rowsOf("special_skill").filter(function (r) { return r.kickerId === kicker.id; });
  panel.appendChild(makeSection("Special Skill", "special_skill", specials,
    { empty: "no special_skill row for this kicker" }));
  for (const table of SS_EXTRA_TABLES) {
    const rows = rowsOf(table).filter(function (r) { return r.specialSkillId === kicker.id; });
    if (rows.length) panel.appendChild(makeSection("Special Skill extra · " + table, table, rows));
  }

  /* Basic attack, grouped by attackCount */
  const attacks = rowsOf("weapon_attack")
    .filter(function (r) { return r.kickerId === kicker.id; })
    .sort(function (a, b) { return a.attackCount - b.attackCount; });
  const attackSection = el("section", { class: "sec" });
  const attackHead = el("h2");
  attackHead.appendChild(el("span", { class: "t" }, "Basic Attack"));
  attackHead.appendChild(el("code", { class: "src" }, "masters_weapon_attack.json"));
  attackHead.appendChild(el("span", { class: "grow" }));
  appendOverrideControls(attackHead, "weapon_attack");
  attackSection.appendChild(attackHead);
  if (!attacks.length) {
    attackSection.appendChild(el("p", { class: "note" }, "no weapon_attack rows for this kicker"));
  }
  for (const attack of attacks) {
    const group = el("div", { class: "row" });
    group.appendChild(makeSection("attackCount " + attack.attackCount, "weapon_attack", [attack], { nested: true }));
    for (const table of WEAPON_EXTRA_TABLES) {
      const rows = rowsOf(table).filter(function (r) {
        return r.kickerId === kicker.id && r.attackCount === attack.attackCount;
      });
      if (rows.length) {
        group.appendChild(makeSection(table, table, rows, { nested: true }));
      }
    }
    attackSection.appendChild(group);
  }
  panel.appendChild(attackSection);
}

/* -------------------------------------------------------------- text tab */

function translationRow(key) {
  const rows = rowsOf("translation");
  for (const row of rows) if (row.key === key) return row;
  return null;
}

function buildScreens() {
  const byScreen = new Map();
  for (const item of state.layout) {
    if (!byScreen.has(item.screen)) byScreen.set(item.screen, []);
    byScreen.get(item.screen).push(item);
  }
  const placed = new Set(state.layout.map(function (item) { return item.key; }));
  const screens = [];
  for (const pair of byScreen) {
    const keys = Array.from(new Set(pair[1].map(function (item) { return item.key; })));
    screens.push({ name: pair[0], rows: pair[1], keys: keys });
  }
  screens.sort(function (a, b) { return b.keys.length - a.keys.length || a.name.localeCompare(b.name); });
  const other = rowsOf("translation").map(function (row) { return row.key; })
    .filter(function (key) { return !placed.has(key); }).sort();
  screens.push({ name: OTHER_SCREEN, rows: [], keys: other });
  state.screens = screens;
}

function textFor(key) {
  const row = translationRow(key);
  return row ? String(row.text) : "";
}

function renderTextPanel(panel, screen) {
  const head = el("div", { class: "phead" });
  const box = el("div");
  box.appendChild(el("h1", null, screen.name));
  box.appendChild(el("div", { class: "meta" }, screen.name === OTHER_SCREEN
    ? "translation rows that no UI prefab references directly: enum names (skillCategoryType.*, conditionType.* ...) and texts the code looks up by key"
    : screen.keys.length + " localized texts · masters_translation.json · wireframe from docs/localize_layout.json (1/3 scale, 1080x1920 canvas)"));
  head.appendChild(box);
  panel.appendChild(head);

  const wrap = el("div", { class: "textwrap" });
  const boxesByKey = new Map();
  if (screen.rows.length) {
    const side = el("div");
    side.appendChild(el("div", { class: "legend" }, "boxes: text element" ));
    const legend = side.lastChild;
    legend.appendChild(el("i", { class: "empty" })); legend.appendChild(document.createTextNode("no translation (blank in game)"));
    legend.appendChild(el("i", { class: "off" })); legend.appendChild(document.createTextNode("outside the canvas (scroll content / layout group)"));
    const wire = el("div", { class: "wire" });
    for (const item of screen.rows) {
      const b = el("div", { class: "box", title: item.path + "\n" + item.key });
      let x = item.x * WIRE_SCALE, y = item.y * WIRE_SCALE;
      const w = Math.max(item.w * WIRE_SCALE, 6), h = Math.max(item.h * WIRE_SCALE, 6);
      let off = false;
      if (x < 0 || y < 0 || x + w > 360 || y + h > 640) {
        off = true;
        x = Math.min(Math.max(x, 0), 360 - Math.min(w, 360));
        y = Math.min(Math.max(y, 0), 640 - Math.min(h, 640));
      }
      b.style.left = x + "px"; b.style.top = y + "px"; b.style.width = w + "px"; b.style.height = h + "px";
      b.style.fontSize = Math.max(6, Math.min(item.font * WIRE_SCALE, 24)) + "px";
      const text = textFor(item.key);
      b.textContent = text || item.key;
      if (!translationRow(item.key)) b.classList.add("empty");
      if (off) b.classList.add("off");
      b.addEventListener("click", function () {
        const input = state.inputs.get(fieldKey("translation", (translationRow(item.key) || {}).id, "text"));
        if (input) { input.focus(); input.select(); input.scrollIntoView({ block: "center" }); }
      });
      wire.appendChild(b);
      if (!boxesByKey.has(item.key)) boxesByKey.set(item.key, []);
      boxesByKey.get(item.key).push(b);
    }
    side.appendChild(wire);
    wrap.appendChild(side);
  }

  const rowsBox = el("div", { class: "textrows" });
  const seen = new Set();
  const ordered = screen.rows.length ? screen.rows.map(function (r) { return r.key; }) : screen.keys;
  for (const key of ordered) {
    if (seen.has(key)) continue;
    seen.add(key);
    const trow = el("div", { class: "trow" });
    const left = el("div");
    left.appendChild(el("div", { class: "kk" }, key));
    const item = screen.rows.filter(function (r) { return r.key === key; })[0];
    if (item) left.appendChild(el("div", { class: "pp" }, item.path.replace(screen.name + "/", "")));
    trow.appendChild(left);
    const row = translationRow(key);
    if (!row) {
      trow.appendChild(el("span", { class: "missing" }, "no row in masters_translation.json (blank in game) - run scripts/generate_translations.py"));
      rowsBox.appendChild(trow);
      continue;
    }
    const input = el("input", { type: "text", value: String(row.text) });
    input.dataset.table = "translation";
    input.dataset.rowId = String(row.id);
    input.dataset.field = "text";
    input.addEventListener("input", function () {
      row.text = input.value;
      const boxes = boxesByKey.get(key) || [];
      for (const b of boxes) { b.textContent = input.value || key; b.classList.toggle("hot", input.value !== state.pristine.translation.filter(function (r) { return r.id === row.id; })[0].text); }
      refreshDirty();
    });
    input.addEventListener("focus", function () {
      for (const pair of boxesByKey) for (const b of pair[1]) b.classList.toggle("cur", pair[0] === key);
    });
    state.inputs.set(fieldKey("translation", row.id, "text"), input);
    trow.appendChild(input);
    rowsBox.appendChild(trow);
  }
  wrap.appendChild(rowsBox);
  panel.appendChild(wrap);
}

async function loadLatestInformation() {
  try {
    state.latestInformation = await fetchJSON("/api/latest-information", { cache: "no-store" });
  } catch (error) {
    state.latestInformation = { error: error.message, mode: "text", content: "", htmlContent: "", externalUrl: "" };
  }
  return state.latestInformation;
}

  const isEs = BalanceI18n.getLang() === "es";
  const wrap = el("div", { class: "mpanel" });
  const head = el("div", { class: "phead" });
  const title = el("div");

function validatedLatestInformationUrl(value) {
  try {
    const input = (value || "").trim();
    if (input.length > 2048 || /[\u0000-\u001f\u007f]/.test(input)) return "";
    const parsed = new URL(input);
    return (parsed.protocol === "https:" || parsed.protocol === "http:") && parsed.hostname &&
      !parsed.username && !parsed.password && parsed.href.length <= 2048 ? parsed.href : "";
  } catch (ignored) { return ""; }
}

function latestInformationPreviewDocument(source, resourcePolicy) {
  const safePolicy = (resourcePolicy || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  const meta = '<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="' + safePolicy + '">';
  // Keep the policy ahead of every supplied byte; untrusted/malformed markup may contain a
  // fake <head> in a comment or script, so inserting into the source via regex is unsafe.
  return "<!doctype html><html><head>" + meta + "</head><body>" + source + "</body></html>";
}

function latestInformationPayload(mode, text, html, url) {
  if (mode === "text") return text.length <= 12000
    ? { mode: "text", content: text } : { error: "Text exceeds 12000 characters." };
  if (mode === "html") {
    const bytes = new TextEncoder().encode(html).length;
    return bytes <= 1048576 ? { mode: "html", htmlContent: html }
      : { error: "HTML exceeds 1 MiB UTF-8." };
  }
  const target = validatedLatestInformationUrl(url);
  return target ? { mode: "url", externalUrl: target }
    : { error: "Enter an absolute HTTP or HTTPS URL without embedded credentials." };
}

function appendLatestInline(parent, text) {
  const pattern = /(\*\*[^*]+\*\*|`[^`]+`|https?:\/\/[^\s<>]+)/gi;
  let last = 0;
  for (const match of text.matchAll(pattern)) {
    if (match.index > last) parent.appendChild(document.createTextNode(text.slice(last, match.index)));
    const token = match[0];
    if (token.startsWith("**")) {
      parent.appendChild(el("strong", null, token.slice(2, -2)));
    } else if (token.startsWith("`")) {
      parent.appendChild(el("code", null, token.slice(1, -1)));
    } else {
      const anchor = el("a", { href: token, target: "_blank", rel: "noopener noreferrer" }, token);
      parent.appendChild(anchor);
    }
    last = match.index + token.length;
  }
  if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
}

function renderLatestInformationPreview(preview, content) {
  clear(preview);
  const lines = content.split(/\r?\n/);
  let paragraph = [];
  let list = null;
  const flushParagraph = function () {
    if (!paragraph.length) return;
    const p = el("p");
    paragraph.forEach(function (line, index) {
      if (index) p.appendChild(document.createElement("br"));
      appendLatestInline(p, line);
    });
    preview.appendChild(p);
    paragraph = [];
  };
  const closeList = function () { list = null; };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (!line.trim()) { flushParagraph(); closeList(); continue; }
    const heading = /^(#{1,3})\s+(.+)$/.exec(line);
    if (heading) {
      flushParagraph(); closeList();
      const h = el("h" + Math.min(heading[1].length + 1, 4));
      appendLatestInline(h, heading[2]);
      preview.appendChild(h);
      continue;
    }
    const bullet = /^\s*[-*]\s+(.+)$/.exec(line);
    if (bullet) {
      flushParagraph();
      if (!list) { list = el("ul"); preview.appendChild(list); }
      const item = el("li"); appendLatestInline(item, bullet[1]); list.appendChild(item);
      continue;
    }
    closeList();
    paragraph.push(line);
  }
  flushParagraph();
}

/* ------------------------------------------------------------ dirty + save */

function refreshDirty() {
  state.dirtyFields.clear();
  state.dirtyTables.clear();
  for (const table of Object.keys(state.data)) {
    const rows = state.data[table];
    const pristine = state.pristine[table];
    if (!Array.isArray(rows) || !Array.isArray(pristine)) continue;
    const current = new Map(rows.map(function (row) { return [String(row.id), row]; }));
    const before = new Map(pristine.map(function (row) { return [String(row.id), row]; }));
    for (const pair of current) {
      const original = before.get(pair[0]);
      if (!original) {
        /* A row added in the UI: the server accepts it only for effect tables. */
        state.dirtyTables.add(table);
        state.dirtyFields.add(fieldKey(table, pair[0], "__row_added__"));
        continue;
      }
      for (const key of Object.keys(original)) {
        if (!(key in pair[1])) continue;
        if (sameValue(pair[1][key], original[key])) continue;
        state.dirtyFields.add(fieldKey(table, pair[0], key));
        state.dirtyTables.add(table);
      }
    }
    for (const id of before.keys()) {
      if (current.has(id)) continue;
      state.dirtyTables.add(table);
      state.dirtyFields.add(fieldKey(table, id, "__row_deleted__"));
    }
  }
  for (const pair of state.inputs) {
    const input = pair[1];
    input.classList.toggle("dirty", state.dirtyFields.has(pair[0]));
    input.classList.toggle("invalid", input.dataset.invalid === "1");
  }
  const counter = document.getElementById("dirtyCount");
  if (counter) counter.textContent = BalanceI18n.t("footer.unsavedChanges", { count: state.dirtyFields.size });
  counter.classList.toggle("has", state.dirtyFields.size > 0);
  document.getElementById("save").disabled = state.saving || state.dirtyFields.size === 0;
  document.getElementById("revert").disabled = state.saving;
}

function setStatus(lines) {
  const box = document.getElementById("saveStatus");
  clear(box);
  for (const line of lines) {
    box.appendChild(el("div", { class: "line " + line[0] }, line[1]));
  }

async function save() {
  if (state.saving) return;
  const tables = Array.from(state.dirtyTables).sort();
  if (!tables.length) {
    setStatus([["info", BalanceI18n.t("footer.noTablesToSave")]]);
    return;
  }
  state.saving = true;
  refreshDirty();
  const results = [];
  for (const table of tables) {
    setStatus(results.concat([["info", BalanceI18n.t("footer.savingTable", { table: table })]]));
    try {
      const body = await fetchJSON("/api/table/" + table, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rows: state.data[table] })
      });
      if (!body || body.ok !== true) throw new Error("unexpected response");
      state.pristine[table] = JSON.parse(JSON.stringify(state.data[table]));
      results.push(["ok", BalanceI18n.t("footer.savedTableSuccess", { table: table, rows: body.written })]);
    } catch (error) {
      results.push(["err", BalanceI18n.t("footer.savedTableError", { table: table, err: error.message })]);
    }
    setStatus(results);
  }
  state.saving = false;
  refreshDirty();
  if (!results.some(function (line) { return line[0] === "err"; })) {
    results.push(["info", BalanceI18n.t("footer.savedToOverrideDir")]);
  }
  await loadOverrides();
  await loadApplyStatus();
  renderPanel();
  setStatus(results);
}

async function revert() {
  if (state.saving) return;
  state.saving = true;
  setStatus([["info", BalanceI18n.t("footer.revertingMasters")]]);
  try {
    await loadEverything(true);
    await loadOverrides();
    buildScreens();
    state.inputs.clear();
    renderPanel();
    setStatus([["info", BalanceI18n.t("footer.revertedMastersSuccess")]]);
  } catch (error) {
    setStatus([["err", BalanceI18n.t("footer.revertedMastersError", { err: error.message })]]);
  }
  state.saving = false;
  refreshDirty();
}

/* Restart the API so it re-reads the override files, then wait for the health probe. */
async function applyNow() {
  if (state.applying) return;
  const command = (state.apply && state.apply.applyCmd) || "docker restart deploy-api-1";
  const pending = (state.apply && state.apply.pending) || [];
  const pendingText = pending.length ? BalanceI18n.t("footer.pendingOverrides", { list: pending.join(", ") }) : "";
  if (!window.confirm(BalanceI18n.t("footer.confirmRestart", { pending: pendingText, cmd: command }))) {
    return;
  }
  state.applying = true;
  renderApplyStatus();
  setStatus([["info", BalanceI18n.t("footer.restartingApi", { cmd: command })]]);
  try {
    const body = await fetchJSON("/api/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" }
    });
    if (!body || body.ok !== true) throw new Error((body && body.error) || "apply failed");
    setStatus([
      ["ok", BalanceI18n.t("footer.restartedApiSuccess", { seconds: body.elapsedSeconds, probes: (body.health && body.health.attempts) || 0 })],
      ["info", (body.pending && body.pending.length)
        ? BalanceI18n.t("footer.stillPendingOverrides", { list: body.pending.join(", ") })
        : BalanceI18n.t("footer.noPendingOverrides")],
    ]);
    state.apply = await fetchJSON("/api/apply", { cache: "no-store" });
  } catch (error) {
    setStatus([["err", BalanceI18n.t("footer.applyFailed", { err: error.message })]]);
    try { state.apply = await fetchJSON("/api/apply", { cache: "no-store" }); } catch (ignored) { /* keep the old status */ }
  }
  state.applying = false;
  renderApplyStatus();
}

    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

function renderHealthPanel(panel) {
  const isEs = BalanceI18n.getLang() === "es";
  const wrap = el("div", { class: "mpanel" });
  wrap.style.maxWidth = "1100px";

  const head = el("div", { class: "phead" });
  const box = el("div");
  box.appendChild(el("h1", null, BalanceI18n.t("health.title")));
  box.appendChild(el("div", { class: "meta" }, BalanceI18n.t("health.meta")));
  head.appendChild(box);
  wrap.appendChild(head);

  const controls = el("div", { class: "mbtns" });
  for (const pair of HEALTH_WINDOWS) {
    const label = pair[0] === "deploy" ? BalanceI18n.t("health.windowDeploy") : (pair[0] === "24h" ? BalanceI18n.t("health.window24h") : BalanceI18n.t("health.window7d"));
    const button = el("button", { type: "button" }, label);
    if ((state.healthWindow || "deploy") === pair[0]) button.className = "on";
    button.disabled = !!state.healthLoading;
    button.addEventListener("click", function () {
      state.healthWindow = pair[0];
      state.healthBattle = null;
      state.healthBattleId = "";
      loadHealth().then(function () { renderList(); renderPanel(); });
    });
    controls.appendChild(button);
  }
  wrap.appendChild(controls);

  const health = state.health;
  if (!health || !health.summary) {
    const errorPrefix = isEs ? "no se pudo leer la telemetría: " : "could not read telemetry: ";
    const loadingText = isEs ? BalanceI18n.t("health.loadingTelemetry") : "loading telemetry...";
    wrap.appendChild(el("p", { class: "note" },
      health && health.error ? (isEs ? "no se pudo leer la telemetría: " : "could not read telemetry: ") + health.error : (isEs ? "cargando telemetría..." : "loading telemetry...")));
    panel.appendChild(wrap);
    return;
  }

  const summary = health.summary;
  const totals = summary.totals || {};
  const info = summary.window || {};
  wrap.appendChild(el("p", { class: "note" },
    "window " + (info.name || state.healthWindow) + " · since " + (info.since || "-") +
    " · release " + (info.releaseSha || "-") + " · run " + (info.runId || "-") +
    " · store " + ((summary.telemetry && summary.telemetry.store) || "-")));

  const outcomes = el("section", { class: "sec" });
  outcomes.appendChild(el("h2", null, BalanceI18n.t("health.matchOutcomes")));
  const outcomeGrid = el("div", { id: "healthGrid" });
  const outcomePairs = [
    [BalanceI18n.t("health.outcomes.clean"), totals.clean],
    [BalanceI18n.t("health.outcomes.partial"), totals.partial],
    [BalanceI18n.t("health.outcomes.abandoned"), totals.abandoned],
    [BalanceI18n.t("health.outcomes.neverStarted"), totals.neverStarted],
    [BalanceI18n.t("health.outcomes.running"), totals.running],
    [BalanceI18n.t("health.outcomes.matching"), totals.matching]
  ];
  for (const pair of outcomePairs) {
    outcomeGrid.appendChild(healthCard(pair[0], pair[1]));
  }
  outcomes.appendChild(outcomeGrid);
  wrap.appendChild(outcomes);

  const players = el("section", { class: "sec" });
  players.appendChild(el("h2", null, BalanceI18n.t("health.playerStatuses")));
  const playerGrid = el("div", { id: "healthGrid" });
  const statusPairs = [
    [BalanceI18n.t("health.statuses.completed"), totals.completedPlayers],
    [BalanceI18n.t("health.statuses.reconnected"), totals.reconnectedCompleted],
    [BalanceI18n.t("health.statuses.reconnectFailed"), totals.reconnectFailed],
    [BalanceI18n.t("health.statuses.droppedSilent"), totals.droppedSilent],
    [BalanceI18n.t("health.statuses.relaunched"), totals.relaunched],
    [BalanceI18n.t("health.statuses.matchingFailures"), totals.matchingFailures],
    [BalanceI18n.t("health.statuses.matchingTimeouts"), totals.matchingTimeouts],
    [BalanceI18n.t("health.statuses.cancelled"), totals.cancelled],
    [BalanceI18n.t("health.statuses.exceptions"), totals.exceptions]
  ];
  for (const pair of statusPairs) {
    playerGrid.appendChild(healthCard(pair[0], pair[1]));
  }
  players.appendChild(playerGrid);
  wrap.appendChild(players);

  const exceptions = el("section", { class: "sec" });
  exceptions.appendChild(el("h2", null, BalanceI18n.t("health.clientExceptions")));
  const groups = (health.exceptions && health.exceptions.groups) || [];
  if (health.exceptions && health.exceptions.error) {
    exceptions.appendChild(el("p", { class: "note" }, (isEs ? "no se pudieron leer las excepciones: " : "could not read exceptions: ") + BalanceI18n.translateApiError(health.exceptions.error)));
  } else if (!groups.length) {
    exceptions.appendChild(el("p", { class: "note" }, BalanceI18n.t("health.noExceptionsInWindow")));
  } else {
    const rows = groups.slice(0, 50).map(function (group) {
      const users = group.users || [];
      const userText = users.join(", ") + (group.userCount > users.length ? " +" + (group.userCount - users.length) : "");
      const versions = (group.appVersions || []).map(function (v) { return v.key + " x" + v.count; }).join(", ");
      return [group.kind || "-", group.count, codeCell((group.fingerprint || "") + String.fromCharCode(10) + (group.signature || "")),
              userText || "-", versions || "-", group.lastAt || "-"];
    });
    exceptions.appendChild(healthTable([
      BalanceI18n.t("health.thKind"),
      BalanceI18n.t("health.thCount"),
      BalanceI18n.t("health.thFingerprintSignature"),
      BalanceI18n.t("health.thUsers"),
      BalanceI18n.t("health.thAppVersions"),
      BalanceI18n.t("health.thLast")
    ], rows));
  }
  wrap.appendChild(exceptions);

  const problems = el("section", { class: "sec" });
  problems.appendChild(el("h2", null, BalanceI18n.t("health.problemMatches")));
  const problemRows = (summary.problemMatches || []).slice(0, 100).map(function (match) {
    const button = el("button", { type: "button" }, BalanceI18n.t("health.drillDownBtn"));
    button.addEventListener("click", function () { loadHealthBattle(match.battleId); });
    const statuses = (match.participants || []).map(function (p) { return p.userId + "=" + p.status; }).join(", ");
    return [button, match.battleId, match.outcome || "-", (match.humans || 0) + "h/" + (match.bots || 0) + "b",
            match.custom ? "custom" : "-", statuses || "-"];
  });
  if (!problemRows.length) {
    problems.appendChild(el("p", { class: "note" }, BalanceI18n.t("health.noProblemMatchesInWindow")));
  } else {
    problems.appendChild(healthTable([
      "",
      BalanceI18n.t("health.thBattle"),
      BalanceI18n.t("health.thOutcome"),
      BalanceI18n.t("health.thRoster"),
      BalanceI18n.t("health.thType"),
      BalanceI18n.t("health.thParticipants")
    ], problemRows));
  }
  const byId = el("div", { class: "mfield" });
  byId.appendChild(el("span", { class: "k" }, BalanceI18n.t("health.openById")));
  const idWrap = el("div", { class: "mbtns" });
  const idInput = el("input", { type: "text", value: state.healthBattleId || "" });
  const idButton = el("button", { type: "button" }, BalanceI18n.t("health.openBtn"));
  idButton.addEventListener("click", function () {
    const value = idInput.value.trim();
    if (value) loadHealthBattle(value);
  });
  idWrap.appendChild(idInput);
  idWrap.appendChild(idButton);
  byId.appendChild(idWrap);
  problems.appendChild(byId);
  wrap.appendChild(problems);

  if (state.healthBattle) {
    const drill = el("section", { class: "sec" });
    drill.appendChild(el("h2", null, (isEs ? "Combate " : "Battle ") + (state.healthBattleId || "")));
    if (state.healthBattle.error) {
      drill.appendChild(el("p", { class: "note" }, (isEs ? "no se pudo cargar el combate: " : "could not load battle: ") + BalanceI18n.translateApiError(state.healthBattle.error)));
    } else {
      const data = state.healthBattle.data || {};
      const battle = data.battle;
      if (battle) {
        drill.appendChild(el("p", { class: "note" },
          "outcome " + (battle.outcome || "open") + " · rule " + battle.ruleId + " · field " + battle.fieldId +
          " · humans " + battle.humans + " · bots " + battle.bots + " · created " + (battle.createdAt || "-")));
      }
      const participantRows = (data.participants || []).map(function (p) {
        return [p.userId, p.status, p.kickerId + "/" + p.costumeId, p.team,
                (p.appVersion || "-") + " " + (p.deviceName || ""), p.reconnectBegins, p.exceptionCount];
      });
      drill.appendChild(healthTable([
        isEs ? "Usuario" : "User",
        isEs ? "Estado" : "Status",
        isEs ? "Kicker/Disfraz" : "Kicker/Costume",
        isEs ? "Equipo" : "Team",
        isEs ? "App / dispositivo" : "App / device",
        isEs ? "Reconexiones" : "Reconnects",
        isEs ? "Excepciones" : "Exceptions"
      ], participantRows));
      const timelineRows = (data.timeline || []).slice(-300).map(function (event) {
        return [event.at || "-", event.kind || "-", event.userId || "-", codeCell(JSON.stringify(event.payload || {}))];
      });
      drill.appendChild(el("h2", null, isEs ? "Línea de tiempo (más antiguo primero)" : "Timeline (oldest first)"));
      drill.appendChild(healthTable([
        isEs ? "Hora" : "At",
        isEs ? "Tipo" : "Kind",
        isEs ? "Usuario" : "User",
        isEs ? "Carga útil" : "Payload"
      ], timelineRows));
    }
    wrap.appendChild(drill);
  }

  const telemetry = summary.telemetry || {};
  const stats = el("section", { class: "sec" });
  stats.appendChild(el("h2", null, BalanceI18n.t("health.telemetryWriter")));
  stats.appendChild(el("p", { class: "note" },
    "store " + (telemetry.store || "-") + " · queue " + (telemetry.queueDepth === undefined ? "-" : telemetry.queueDepth) +
    " · written " + (telemetry.written === undefined ? "-" : telemetry.written) +
    " · dropped " + (telemetry.dropped === undefined ? "-" : telemetry.dropped) +
    " · errors " + (telemetry.writeErrors === undefined ? "-" : telemetry.writeErrors) +
    " · tracked battles " + (telemetry.trackedBattles === undefined ? "-" : telemetry.trackedBattles)));
  if (telemetry.lastWriteError) stats.appendChild(el("p", { class: "note" }, "last error: " + telemetry.lastWriteError));
  wrap.appendChild(stats);

  const help = el("section", { class: "sec" });
  help.appendChild(el("h2", null, BalanceI18n.t("health.howItReaches")));
  help.appendChild(el("p", { class: "note" },
    isEs
      ? "La API solo responde /admin/ops/* en su propio bucle local y su puerto HTTP no está publicado. Esta herramienta lo ejecuta dentro del contenedor (docker exec deploy-api-1 curl -sS http://127.0.0.1:8080/admin/ops/...); define KF_BALANCE_OPS_URL para invocar el endpoint directamente en un host de desarrollo."
      : "The API only answers /admin/ops/* on its own loopback and its HTTP port is not published. This tool runs it inside the container (docker exec deploy-api-1 curl -sS http://127.0.0.1:8080/admin/ops/...); set KF_BALANCE_OPS_URL to call the endpoint directly on a dev host."));
  wrap.appendChild(help);

  wrap.appendChild(el("div", { id: "healthStatus" }));
  panel.appendChild(wrap);
}/* ----------------------------------------------------------- bot AI editor */

function getPresetSummary(pr, mode) {
  const isEs = BalanceI18n.getLang() === "es";
  if (isEs) {
    if (pr.summaries && pr.summaries[mode]) return pr.summaries[mode];
    return pr.behaviorDesc || "";
  } else {
    if (pr.summariesEn && pr.summariesEn[mode]) return pr.summariesEn[mode];
    return pr.behaviorDescEn || pr.summaries?.[mode] || "";
  }
}

function detectActivePreset(prof, mode, kickerId) {
  const key = mode + "/" + kickerId;
  if (state.botAi.activePresets && state.botAi.activePresets[key]) {
    return state.botAi.activePresets[key];
  }
  if (!prof || !prof.motivations) return "balanced";
  const m = prof.motivations;
  if (m.attack >= 80 && m.defense <= 30) return "fight";
  if (m.score >= 80 && m.attack <= 35) return "run_score";
  if (m.defense >= 80 && m.score <= 35) return "defend_base";
  if (m.defense >= 50 && m.score >= 40 && m.attack <= 30) return "support_team";
  return "balanced";
}

function showToast(message) {
  let toast = document.getElementById("botAiToast");
  if (!toast) {
    toast = el("div", { id: "botAiToast" });
    toast.style.position = "fixed";
    toast.style.top = "16px";
    toast.style.right = "16px";
    toast.style.background = "var(--bg2)";
    toast.style.color = "var(--ok)";
    toast.style.border = "1px solid var(--ok)";
    toast.style.padding = "10px 16px";
    toast.style.borderRadius = "8px";
    toast.style.boxShadow = "0 6px 20px rgba(0,0,0,0.5)";
    toast.style.zIndex = "9999";
    toast.style.fontSize = "13px";
    toast.style.fontWeight = "500";
    toast.style.transition = "opacity 0.3s ease";
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.style.opacity = "1";
  toast.style.display = "block";
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function () {
    toast.style.opacity = "0";
    setTimeout(function () { toast.style.display = "none"; }, 350);
  }, 3500);
}

async function loadBotAiProfiles(force) {
  if (!force && state.botAi.loaded) return;
  state.botAi.loading = true;
  state.botAi.error = null;
  renderBotAiPanel(document.getElementById("panel"));
  renderBotAiList();

  try {
    const data = await fetchJSON("/api/bot-ai/profiles", { cache: "no-store" });
    state.botAi.rawProfiles = data.profiles || [];
    state.botAi.hash = data.hash || null;
    state.botAi.revision = data.revision || null;
    state.botAi.loaded = true;
    state.botAi.loading = false;
  } catch (err) {
    state.botAi.error = err.message || (BalanceI18n.getLang() === "es" ? "Error al cargar perfiles de IA de bots" : "Failed to load bot AI profiles");
    state.botAi.loading = false;
  }
  renderBotAiList();
  renderBotAiPanel(document.getElementById("panel"));
}

function getPristineBotAiProfile(mode, kickerId) {
  const kid = Number(kickerId);
  for (const p of state.botAi.rawProfiles) {
    if (p.mode === mode && p.kickerId === kid) {
      return p;
    }
  }
  return null;
}

function getActiveBotAiProfile(mode, kickerId) {
  const kid = Number(kickerId);
  const key = mode + "/" + kid;
  if (state.botAi.drafts[key]) {
    return state.botAi.drafts[key];
  }
  const pristine = getPristineBotAiProfile(mode, kid);
  return pristine ? JSON.parse(JSON.stringify(pristine)) : null;
}

function isBotAiProfileDirty(mode, kickerId) {
  const kid = Number(kickerId);
  const key = mode + "/" + kid;
  return !!state.botAi.drafts[key];
}

function setBotAiField(mode, kickerId, section, field, value) {
  const kid = Number(kickerId);
  const key = mode + "/" + kid;
  if (!state.botAi.drafts[key]) {
    const pristine = getPristineBotAiProfile(mode, kid);
    if (!pristine) return;
    state.botAi.drafts[key] = JSON.parse(JSON.stringify(pristine));
  }
  const draft = state.botAi.drafts[key];
  if (section) {
    draft[section][field] = value;
  } else {
    draft[field] = value;
  }
  updateBotAiDirtyState();
}

function applyBotAiPreset(mode, kickerId, presetId) {
  const kid = Number(kickerId);
  const key = mode + "/" + kid;
  if (!state.botAi.drafts[key]) {
    const pristine = getPristineBotAiProfile(mode, kid);
    if (!pristine) return;
    state.botAi.drafts[key] = JSON.parse(JSON.stringify(pristine));
  }
  const draft = state.botAi.drafts[key];
  const preset = BOT_AI_INTENT_PRESETS.find(p => p.id === presetId);
  if (!preset) return;
  preset.apply(draft, mode);
  if (!state.botAi.activePresets) state.botAi.activePresets = {};
  state.botAi.activePresets[key] = presetId;
  updateBotAiDirtyState();
  renderBotAiPanel(document.getElementById("panel"));
  renderBotAiList();
}

function discardBotAiDraft(mode, kickerId) {
  const kid = Number(kickerId);
  const key = mode + "/" + kid;
  delete state.botAi.drafts[key];
  if (state.botAi.activePresets) delete state.botAi.activePresets[key];
  updateBotAiDirtyState();
  renderBotAiList();
  renderBotAiPanel(document.getElementById("panel"));
  const isEs = BalanceI18n.getLang() === "es";
  showToast(isEs ? "Borrador descartado." : "Draft discarded.");
}

function updateBotAiDirtyState() {
  const dirtyCount = Object.keys(state.botAi.drafts).length;
  const isEs = BalanceI18n.getLang() === "es";

  const saveBtn = document.getElementById("botAiSaveBtn");
  if (saveBtn) {
    saveBtn.disabled = dirtyCount === 0 || state.botAi.saving;
    const baseSaveText = isEs ? "Guardar cambios" : "Save changes";
    saveBtn.textContent = state.botAi.saving ? (isEs ? "Guardando..." : "Saving...")
      : (dirtyCount > 0 ? baseSaveText + " (" + dirtyCount + ")" : baseSaveText);
  }

  const curKid = state.botAi.selectedKickerId;
  const curMode = state.botAi.selectedMode;
  const isCurDirty = isBotAiProfileDirty(curMode, curKid);
  const discardBtn = document.getElementById("botAiDiscardBtn");
  if (discardBtn) {
    discardBtn.disabled = !isCurDirty;
  }

  // Update dots and count on sidebar
  const items = document.querySelectorAll("#list .bot-ai-sidebar-item");
  for (const item of items) {
    const kid = Number(item.dataset.kickerId);
    const itemDirty = isBotAiProfileDirty(curMode, kid);
    let dot = item.querySelector(".dot");
    if (itemDirty && !dot) {
      dot = el("span", { class: "dot", title: isEs ? "Borrador con cambios sin guardar" : "Draft with unsaved changes" });
      item.appendChild(dot);
    } else if (!itemDirty && dot) {
      dot.remove();
    }
  }

  const countEl = document.querySelector("#list li.count");
  if (countEl) {
    const locM = BalanceI18n.getBotAiMode(curMode);
    countEl.textContent = "14 kickers (" + (locM.name || curMode) + ")" +
      (dirtyCount > 0 ? " · " + dirtyCount + (isEs ? " modificado(s)" : " modified") : "");
  }
}

function deriveFriendlyBehaviors(draft, pristine, mode) {
  const isEs = BalanceI18n.getLang() === "es";
  const descriptions = [];

  // 1. Motivations
  if (draft.motivations.attack !== pristine.motivations.attack) {
    const diff = draft.motivations.attack - pristine.motivations.attack;
    if (diff > 0) {
      descriptions.push(isEs ? "Aumenta la agresividad en combate (+" + diff + ")" : "Increases combat aggression (+" + diff + ")");
    } else {
      descriptions.push(isEs ? "Disminuye la agresividad en combate (" + diff + ")" : "Decreases combat aggression (" + diff + ")");
    }
  }

  if (draft.motivations.defense !== pristine.motivations.defense) {
    const diff = draft.motivations.defense - pristine.motivations.defense;
    if (diff > 0) {
      descriptions.push(isEs ? "Mayor enfoque defensivo y protección de zona (+" + diff + ")" : "Greater defensive focus and zone protection (+" + diff + ")");
    } else {
      descriptions.push(isEs ? "Menor prioridad a la defensa (" + diff + ")" : "Lower defensive priority (" + diff + ")");
    }
  }

  if (draft.motivations.score !== pristine.motivations.score) {
    const diff = draft.motivations.score - pristine.motivations.score;
    if (diff > 0) {
      if (mode === "RapidBall") {
        descriptions.push(isEs ? "Mayor agresividad para llevar el balón a la portería (+" + diff + ")" : "Greater drive to carry the ball to the goal (+" + diff + ")");
      } else if (mode === "FlagFlight") {
        descriptions.push(isEs ? "Mayor enfoque en capturar y asegurar la bandera (+" + diff + ")" : "Greater focus on capturing and securing the flag (+" + diff + ")");
      } else {
        descriptions.push(isEs ? "Prioriza recolectar y asegurar cristales (+" + diff + ")" : "Prioritizes collecting and securing crystals (+" + diff + ")");
      }
    } else {
      descriptions.push(isEs ? "Menor urgencia por recolectar/objetivo (" + diff + ")" : "Lower urgency for objective collection (" + diff + ")");
    }
  }

  // 2. Dash Intervals
  if (draft.dashIntervals.attack !== pristine.dashIntervals.attack) {
    if (draft.dashIntervals.attack < pristine.dashIntervals.attack) {
      descriptions.push(isEs ? "Impulsos ofensivos más rápidos y frecuentes" : "Faster and more frequent offensive dashes");
    } else {
      descriptions.push(isEs ? "Impulsos ofensivos más pausados" : "More measured offensive dashes");
    }
  }
  if (draft.dashIntervals.defense !== pristine.dashIntervals.defense) {
    if (draft.dashIntervals.defense < pristine.dashIntervals.defense) {
      descriptions.push(isEs ? "Maniobras de repliegue defensivo más rápidas" : "Faster defensive retreat maneuvers");
    } else {
      descriptions.push(isEs ? "Maniobras defensivas más pausadas" : "More measured defensive maneuvers");
    }
  }
  if (draft.dashIntervals.score !== pristine.dashIntervals.score) {
    if (draft.dashIntervals.score < pristine.dashIntervals.score) {
      descriptions.push(isEs ? "Desplazamiento más veloz hacia objetivos" : "Faster movement toward objectives");
    } else {
      descriptions.push(isEs ? "Desplazamiento más medido hacia objetivos" : "More measured movement toward objectives");
    }
  }

  // 3. Skill Intervals
  if (draft.skillIntervals.attack !== pristine.skillIntervals.attack) {
    if (draft.skillIntervals.attack < pristine.skillIntervals.attack) {
      descriptions.push(isEs ? "Uso más frecuente de habilidades ofensivas" : "More frequent offensive skill usage");
    } else {
      descriptions.push(isEs ? "Uso más conservador de habilidades ofensivas" : "More conservative offensive skill usage");
    }
  }
  if (draft.skillIntervals.heal !== pristine.skillIntervals.heal) {
    if (draft.skillIntervals.heal < pristine.skillIntervals.heal) {
      descriptions.push(isEs ? "Uso más frecuente de habilidades de curación" : "More frequent heal skill usage");
    } else {
      descriptions.push(isEs ? "Uso más espaciado de habilidades de curación" : "More spaced out heal skill usage");
    }
  }

  // 4. Heal Damage Rate
  if (draft.healDamageRate !== pristine.healDamageRate) {
    if (draft.healDamageRate < pristine.healDamageRate) {
      descriptions.push(isEs ? "Se cura antes tras sufrir daño leve" : "Heals sooner after taking light damage");
    } else {
      descriptions.push(isEs ? "Espera a recibir más daño para curarse" : "Waits to take more damage before healing");
    }
  }

  // 5. Can Lockon
  if (draft.canLockon !== pristine.canLockon) {
    descriptions.push(draft.canLockon ? (isEs ? "Fijar blanco activado" : "Lock-on enabled") : (isEs ? "Fijar blanco desactivado" : "Lock-on disabled"));
  }

  // 6. Score to deposit
  if (mode !== "FlagFlight" && draft.scoreToDeposit !== pristine.scoreToDeposit) {
    if (draft.scoreToDeposit > pristine.scoreToDeposit) {
      descriptions.push(isEs ? "Acumula más cristales antes de depositar" : "Hoards more crystals before depositing");
    } else {
      descriptions.push(isEs ? "Deposita cristales con mayor frecuencia" : "Deposits crystals more frequently");
    }
  }

  return descriptions;
}

function getBotAiDiff() {
  const diffs = [];
  const isEs = BalanceI18n.getLang() === "es";
  const fieldLabels = isEs ? {
    "motivations.attack": "Agresividad en combate (Ataque)",
    "motivations.defense": "Instinto defensivo (Defensa)",
    "motivations.score": "Enfoque en objetivos (Puntuación)",
    "dashIntervals.attack": "Impulso dash en combate",
    "dashIntervals.defense": "Impulso dash defensivo",
    "dashIntervals.score": "Impulso dash objetivo",
    "skillIntervals.attack": "Intervalo habilidad ataque",
    "skillIntervals.heal": "Intervalo habilidad curación",
    "skillIntervals.buff": "Intervalo habilidad mejora",
    "skillIntervals.trap": "Intervalo habilidad trampa",
    "skillIntervals.warp": "Intervalo habilidad warp",
    "healDamageRate": "Umbral de daño para curar",
    "canLockon": "Permitir fijar blanco",
    "scoreToDeposit": "Cristales para depositar"
  } : {
    "motivations.attack": "Combat Aggression (Attack)",
    "motivations.defense": "Defensive Instinct (Defense)",
    "motivations.score": "Objective Focus (Score)",
    "dashIntervals.attack": "Attack dash impulse",
    "dashIntervals.defense": "Defensive dash impulse",
    "dashIntervals.score": "Objective dash impulse",
    "skillIntervals.attack": "Attack skill cooldown",
    "skillIntervals.heal": "Heal skill cooldown",
    "skillIntervals.buff": "Buff skill cooldown",
    "skillIntervals.trap": "Trap skill cooldown",
    "skillIntervals.warp": "Warp skill cooldown",
    "healDamageRate": "Damage threshold to heal",
    "canLockon": "Allow lock-on",
    "scoreToDeposit": "Crystals to deposit"
  };

  const yesStr = BalanceI18n.t("common.yes");
  const noStr = BalanceI18n.t("common.no");
  const secStr = BalanceI18n.t("common.secondsUnit");

  for (const key of Object.keys(state.botAi.drafts)) {
    const [mode, kidStr] = key.split("/");
    const kickerId = Number(kidStr);
    const draft = state.botAi.drafts[key];
    const pristine = getPristineBotAiProfile(mode, kickerId);
    if (!pristine) continue;

    const kickerMeta = getBotAiKickerMeta(kickerId);
    const changes = [];
    for (const prop of ["attack", "defense", "score"]) {
      if (draft.motivations[prop] !== pristine.motivations[prop]) {
        changes.push({
          label: fieldLabels["motivations." + prop],
          oldVal: pristine.motivations[prop],
          newVal: draft.motivations[prop]
        });
      }
    }
    for (const prop of ["attack", "defense", "score"]) {
      if (draft.dashIntervals[prop] !== pristine.dashIntervals[prop]) {
        changes.push({
          label: fieldLabels["dashIntervals." + prop],
          oldVal: pristine.dashIntervals[prop] + secStr,
          newVal: draft.dashIntervals[prop] + secStr
        });
      }
    }
    for (const prop of ["attack", "heal", "buff", "trap", "warp"]) {
      if (draft.skillIntervals[prop] !== pristine.skillIntervals[prop]) {
        changes.push({
          label: fieldLabels["skillIntervals." + prop],
          oldVal: pristine.skillIntervals[prop] + secStr,
          newVal: draft.skillIntervals[prop] + secStr
        });
      }
    }
    if (draft.healDamageRate !== pristine.healDamageRate) {
      changes.push({
        label: fieldLabels["healDamageRate"],
        oldVal: Math.round(pristine.healDamageRate * 100) + "%",
        newVal: Math.round(draft.healDamageRate * 100) + "%"
      });
    }
    if (draft.canLockon !== pristine.canLockon) {
      changes.push({
        label: fieldLabels["canLockon"],
        oldVal: pristine.canLockon ? (isEs ? "Sí" : "Yes") : "No",
        newVal: draft.canLockon ? (isEs ? "Sí" : "Yes") : "No"
      });
    }
    if (draft.scoreToDeposit !== pristine.scoreToDeposit) {
      changes.push({
        label: fieldLabels["scoreToDeposit"],
        oldVal: pristine.scoreToDeposit,
        newVal: draft.scoreToDeposit
      });
    }

    if (changes.length > 0) {
      const modeObj = BalanceI18n.getBotAiMode(mode);
      diffs.push({
        mode: modeObj ? modeObj.name : mode,
        profile: kickerMeta.name,
        kickerId: kickerId,
        key: key,
        changes: changes,
        behaviors: deriveFriendlyBehaviors(draft, pristine, mode)
      });
    }
  }
  return diffs;
}
