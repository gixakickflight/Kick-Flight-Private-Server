async function saveBotAiProfiles() {
  const diffs = getBotAiDiff();
  if (diffs.length === 0) return;

  state.botAi.saving = true;
  updateBotAiDirtyState();

  const combined = state.botAi.rawProfiles.map(p => {
    const key = p.mode + "/" + p.kickerId;
    return state.botAi.drafts[key] ? JSON.parse(JSON.stringify(state.botAi.drafts[key])) : JSON.parse(JSON.stringify(p));
  });

  const payload = {
    version: 1,
    $schema: "./bot_ai_profiles.schema.json",
    profiles: combined,
    expectedHash: state.botAi.hash
  };

  try {
    const res = await fetch(balanceUrl("/api/bot-ai/profiles"), {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (res.status === 409) {
      const errJson = await res.json().catch(() => ({}));
      state.botAi.saving = false;
      updateBotAiDirtyState();
      showBotAiConflictModal(errJson.error);
      return;
    }

    if (!res.ok) {
      const errJson = await res.json().catch(() => ({}));
      throw new Error(errJson.error || ("HTTP " + res.status));
    }

    const result = await res.json();
    state.botAi.hash = result.hash;
    state.botAi.revision = result.revision;
    state.botAi.rawProfiles = combined;
    state.botAi.drafts = {};
    state.botAi.saving = false;

    showToast(BalanceI18n.getLang() === "es" ? "✓ Configuración de IA de bots guardada exitosamente en el servidor." : "✓ Bot AI configuration saved successfully to server.");
    renderBotAiList();
    renderBotAiPanel(document.getElementById("panel"));
  } catch (err) {
    state.botAi.saving = false;
    alert((BalanceI18n.getLang() === "es" ? "Error al guardar: " : "Save failed: ") + err.message);
    updateBotAiDirtyState();
  }
}

function renderBotAiList() {
  const list = document.getElementById("list");
  if (!list) return;
  clear(list);

  const isEs = BalanceI18n.getLang() === "es";

  if (state.botAi.loading) {
    list.appendChild(el("li", { class: "count" }, isEs ? "Cargando perfiles..." : "Loading profiles..."));
    return;
  }
  if (state.botAi.error) {
    list.appendChild(el("li", { class: "count", style: "color:var(--err);" }, isEs ? "Error al cargar" : "Failed to load"));
    return;
  }

  const dirtyCount = Object.keys(state.botAi.drafts).length;
  const locM = BalanceI18n.getBotAiMode(state.botAi.selectedMode);
  const countText = "14 kickers (" + (locM.name || state.botAi.selectedMode) + ")" +
    (dirtyCount > 0 ? " · " + dirtyCount + (isEs ? " modificado(s)" : " modified") : "");
  list.appendChild(el("li", { class: "count" }, countText));

  for (const kicker of BOT_AI_KICKERS) {
    const isDirty = isBotAiProfileDirty(state.botAi.selectedMode, kicker.id);
    const isSelected = state.botAi.selectedKickerId === kicker.id;

    const li = el("li", {
      class: "bot-ai-sidebar-item" + (isSelected ? " sel" : ""),
      "data-kicker-id": String(kicker.id)
    });
    li.appendChild(iconFor("kicker", kicker.id, 32));

    const metaBox = el("div", { style: "flex:1; min-width:0;" });
    const nm = el("div", { style: "font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" }, kicker.name);
    const roleText = isEs ? kicker.roleEs : kicker.role;
    const sub = el("div", { class: "sub", style: "white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" }, roleText);
    metaBox.appendChild(nm);
    metaBox.appendChild(sub);
    li.appendChild(metaBox);

    if (isDirty) {
      li.appendChild(el("span", {
        class: "dot",
        title: isEs ? "Borrador con cambios sin guardar" : "Draft with unsaved changes"
      }));
    }

    li.addEventListener("click", function () {
      state.botAi.selectedKickerId = kicker.id;
      state.botAi.selectedProfile = kicker.name;
      renderBotAiList();
      renderBotAiPanel(document.getElementById("panel"));
    });
    list.appendChild(li);
  }
}

function renderBotAiPanel(panel) {
  clear(panel);

  const isEs = BalanceI18n.getLang() === "es";

  if (state.botAi.loading) {
    panel.appendChild(el("p", { class: "empty" }, isEs ? "Cargando perfiles de IA de bots desde el servidor..." : "Loading bot AI profiles from server..."));
    return;
  }
  if (state.botAi.error) {
    const errBox = el("div", { class: "bot-ai-container" });
    errBox.appendChild(el("div", { class: "bot-ai-notice warn" }, "⚠️ " + state.botAi.error));
    const retryBtn = el("button", { type: "button", class: "bot-ai-btn primary" }, isEs ? "Reintentar carga" : "Retry loading");
    retryBtn.addEventListener("click", function () { loadBotAiProfiles(true); });
    errBox.appendChild(retryBtn);
    panel.appendChild(errBox);
    return;
  }
  if (!state.botAi.loaded) {
    loadBotAiProfiles();
    panel.appendChild(el("p", { class: "empty" }, isEs ? "Iniciando editor de IA de bots..." : "Initializing bot AI editor..."));
    return;
  }

  const container = el("div", { class: "bot-ai-container" });

  // 1. Mode Selector: 3-column segmented control (Cristales / Bandera / Balón)
  const modeSeg = el("div", { class: "bot-ai-modes-segmented", role: "tablist", "aria-label": isEs ? "Modo de juego" : "Game mode" });
  for (const m of BOT_AI_MODES) {
    const locM = BalanceI18n.getBotAiMode(m.id);
    const isActive = state.botAi.selectedMode === m.id;
    const btn = el("button", {
      type: "button",
      class: "bot-ai-mode-seg" + (isActive ? " active" : ""),
      "aria-selected": isActive ? "true" : "false"
    }, locM.icon + " " + locM.name);
    btn.addEventListener("click", function () {
      if (state.botAi.selectedMode !== m.id) {
        state.botAi.selectedMode = m.id;
        renderBotAiList();
        renderBotAiPanel(document.getElementById("panel"));
      }
    });
    modeSeg.appendChild(btn);
  }
  container.appendChild(modeSeg);

  // Active Profile Data
  const curMode = state.botAi.selectedMode;
  const curKid = state.botAi.selectedKickerId || 1;
  const kickerMeta = getBotAiKickerMeta(curKid);
  const profile = getActiveBotAiProfile(curMode, curKid);

  if (!profile) {
    container.appendChild(el("p", { class: "empty" }, isEs ? "No se encontró el perfil del kicker en este modo." : "No profile found for kicker in this mode."));
    panel.appendChild(container);
    return;
  }

  const isDirty = isBotAiProfileDirty(curMode, curKid);
  const locCurMode = BalanceI18n.getBotAiMode(curMode);

  // 2. Profile Selection: Mobile Native Select Picker
  const mobilePicker = el("div", { class: "bot-ai-mobile-picker" });
  mobilePicker.appendChild(el("label", { for: "botAiProfileSelect", class: "bot-ai-picker-label" }, isEs ? "Kicker a editar:" : "Kicker to edit:"));
  const pickerRow = el("div", { class: "bot-ai-picker-row" });
  pickerRow.appendChild(iconFor("kicker", kickerMeta.id, 32));
  const select = el("select", {
    id: "botAiProfileSelect",
    class: "bot-ai-select",
    "aria-label": isEs ? "Seleccionar kicker de bot" : "Select bot kicker"
  });
  for (const k of BOT_AI_KICKERS) {
    const opt = el("option", { value: String(k.id) });
    const isD = isBotAiProfileDirty(curMode, k.id);
    const roleText = isEs ? k.roleEs : k.role;
    opt.textContent = k.name + " (" + roleText + ")" + (isD ? (isEs ? " • modificado" : " • modified") : "");
    if (k.id === curKid) opt.selected = true;
    select.appendChild(opt);
  }
  select.addEventListener("change", function () {
    state.botAi.selectedKickerId = Number(select.value);
    state.botAi.selectedProfile = getBotAiKickerMeta(Number(select.value)).name;
    renderBotAiList();
    renderBotAiPanel(document.getElementById("panel"));
  });
  pickerRow.appendChild(select);
  mobilePicker.appendChild(pickerRow);
  container.appendChild(mobilePicker);

  // 3. Profile Header: Individual kicker avatar and info (never shared role groups)
  const summaryHeader = el("div", { class: "bot-ai-profile-summary-header" });
  const sumLeft = el("div", { style: "display:flex; align-items:center; gap:10px;" });
  sumLeft.appendChild(iconFor("kicker", kickerMeta.id, 38));
  const sumTitles = el("div");
  sumTitles.appendChild(el("div", { class: "bot-ai-profile-title" }, (isEs ? "Editando kicker: " : "Editing kicker: ") + kickerMeta.name));
  sumTitles.appendChild(el("div", { class: "bot-ai-affects-label" },
    (isEs ? "Modo: " : "Mode: ") + locCurMode.name + " · " + (isEs ? "Identificador de parámetro: " : "Parameter ID: ") + profile.parameterId));
  sumLeft.appendChild(sumTitles);
  summaryHeader.appendChild(sumLeft);

  container.appendChild(summaryHeader);

  // 4. Intent Presets Section
  const headingBox = el("div", { class: "bot-ai-heading-box" });
  headingBox.appendChild(el("h3", { class: "bot-ai-heading" }, isEs ? "¿Qué quieres que haga?" : "What do you want it to do?"));
  headingBox.appendChild(el("p", { class: "bot-ai-subheading" },
    isEs ? "Selecciona un comportamiento táctico predefinido para aplicar valores optimizados a este kicker."
         : "Select a tactical preset to apply optimized settings to this kicker."));
  container.appendChild(headingBox);

  const activePresetId = detectActivePreset(profile, curMode, curKid);

  const grid = el("div", { class: "bot-ai-intent-grid" });
  for (const preset of BOT_AI_INTENT_PRESETS) {
    const isSelected = activePresetId === preset.id;
    const card = el("div", {
      class: "bot-ai-intent-card " + preset.theme + (isSelected ? " selected" : ""),
      role: "button",
      tabindex: "0"
    });

    const top = el("div", { class: "bot-ai-intent-top" });
    const iconTitle = el("div", { class: "bot-ai-intent-icon-title" });
    iconTitle.appendChild(el("span", { class: "bot-ai-intent-icon" }, preset.icon));
    iconTitle.appendChild(el("span", { class: "bot-ai-intent-title" }, isEs ? preset.title : (preset.titleEn || preset.title)));
    top.appendChild(iconTitle);

    if (isSelected) {
      top.appendChild(el("span", { class: "bot-ai-intent-badge" }, isEs ? "✓ Activo" : "✓ Active"));
    }
    card.appendChild(top);

    card.appendChild(el("p", { class: "bot-ai-intent-desc" }, isEs ? preset.behaviorDesc : (preset.behaviorDescEn || preset.behaviorDesc)));

    const summaryText = getPresetSummary(preset, curMode);
    if (summaryText) {
      card.appendChild(el("div", { class: "bot-ai-intent-mode-summary" },
        (isEs ? "Comportamiento seleccionado: " : "Selected behavior: ") + summaryText));
    }

    const noteText = isEs ? preset.nativeLimit : (preset.nativeLimitEn || preset.nativeLimit);
    if (noteText) {
      card.appendChild(el("p", { class: "bot-ai-intent-note" }, "ℹ️ " + noteText));
    }

    card.addEventListener("click", function () {
      applyBotAiPreset(curMode, curKid, preset.id);
    });
    grid.appendChild(card);
  }
  container.appendChild(grid);

  // 5. Advanced Behavior Sliders & Cooldowns
  const advDetails = el("details", { class: "bot-ai-advanced" });
  if (state.botAi.showAdvanced) advDetails.open = true;
  advDetails.addEventListener("toggle", function () {
    state.botAi.showAdvanced = advDetails.open;
  });

  advDetails.appendChild(el("summary", null, isEs ? "🛠️ Ajustes avanzados de comportamiento (opcional)" : "🛠️ Advanced behavior settings (optional)"));
  const advBody = el("div", { class: "bot-ai-advanced-body" });

  // Motivations
  const motGroup = el("div", { class: "bot-ai-param-group" });
  motGroup.appendChild(el("h4", { style: "margin:0 0 10px; font-size:13px; color:var(--accent);" },
    isEs ? "🎯 Prioridades de Decisión (Motivaciones 0-100)" : "🎯 Decision Priorities (Motivations 0-100)"));

  const motFields = [
    { key: "attack", label: isEs ? "⚔️ Agresividad en combate (Ataque)" : "⚔️ Combat Aggression (Attack)", hint: isEs ? "¿Cuánto prioriza buscar y combatir rivales?" : "How much does the bot prioritize seeking and fighting rivals?" },
    { key: "defense", label: isEs ? "🛡️ Instinto defensivo (Defensa)" : "🛡️ Defensive Instinct (Defense)", hint: isEs ? "¿Cuánto prioriza replegarse o vigilar áreas?" : "How much does the bot prioritize retreating or guarding areas?" },
    { key: "score", label: isEs ? "💎 Enfoque en objetivo (Puntuación)" : "💎 Objective Focus (Score)", hint: isEs ? "¿Cuánto prioriza recolectar cristales o avanzar con el balón?" : "How much does the bot prioritize collecting crystals or moving with the ball?" }
  ];

  for (const f of motFields) {
    const row = el("div", { class: "bot-ai-slider-row" });
    const lbl = el("div", { class: "bot-ai-param-label" });
    lbl.appendChild(el("span", { class: "bot-ai-param-title" }, f.label));
    lbl.appendChild(el("span", { class: "bot-ai-param-hint" }, f.hint));
    row.appendChild(lbl);

    const sliderVal = el("span", { class: "bot-ai-slider-val" }, String(profile.motivations[f.key]));
    const slider = el("input", {
      type: "range",
      class: "bot-ai-slider",
      min: "0",
      max: "100",
      step: "1",
      value: String(profile.motivations[f.key]),
      "aria-label": f.label
    });
    slider.addEventListener("input", function () {
      const val = parseInt(slider.value, 10);
      sliderVal.textContent = String(val);
      setBotAiField(curMode, curKid, "motivations", f.key, val);
    });

    row.appendChild(slider);
    row.appendChild(sliderVal);
    motGroup.appendChild(row);
  }
  advBody.appendChild(motGroup);

  // Dash intervals
  const dashGroup = el("div", { class: "bot-ai-param-group" });
  dashGroup.appendChild(el("h4", { style: "margin:0 0 10px; font-size:13px; color:var(--accent);" },
    isEs ? "⚡ Frecuencia de Impulsos Dash (segundos)" : "⚡ Dash Impulse Frequency (seconds)"));

  const dashFields = [
    { key: "attack", label: isEs ? "En combate" : "In combat", hint: isEs ? "Segundos entre impulsos ofensivos (menor = más frecuente)." : "Seconds between offensive dashes (lower = more frequent)." },
    { key: "defense", label: isEs ? "En defensa" : "In defense", hint: isEs ? "Segundos entre impulsos defensivos." : "Seconds between defensive dashes." },
    { key: "score", label: isEs ? "Hacia objetivo" : "Toward objective", hint: isEs ? "Segundos entre impulsos hacia cristales o balón." : "Seconds between dashes toward crystals or ball." }
  ];

  for (const f of dashFields) {
    const row = el("div", { class: "bot-ai-slider-row" });
    const lbl = el("div", { class: "bot-ai-param-label" });
    lbl.appendChild(el("span", { class: "bot-ai-param-title" }, f.label));
    lbl.appendChild(el("span", { class: "bot-ai-param-hint" }, f.hint));
    row.appendChild(lbl);

    const numInput = el("input", {
      type: "number",
      class: "bot-ai-num-input",
      min: "0.1",
      max: "5.0",
      step: "0.1",
      value: String(profile.dashIntervals[f.key]),
      "aria-label": f.label
    });
    numInput.addEventListener("input", function () {
      const val = parseFloat(numInput.value);
      if (!isNaN(val) && val > 0) {
        setBotAiField(curMode, curKid, "dashIntervals", f.key, val);
      }
    });

    row.appendChild(numInput);
    dashGroup.appendChild(row);
  }
  advBody.appendChild(dashGroup);

  // Skill cooldowns
  const skillGroup = el("div", { class: "bot-ai-param-group" });
  skillGroup.appendChild(el("h4", { style: "margin:0 0 10px; font-size:13px; color:var(--accent);" },
    isEs ? "🕒 Enfriamiento de Habilidades (segundos)" : "🕒 Skill Cooldowns (seconds)"));

  const skillFields = [
    { key: "attack", label: isEs ? "Habilidad de ataque" : "Attack skill", hint: isEs ? "Enfriamiento entre usos ofensivos." : "Cooldown between offensive uses." },
    { key: "heal", label: isEs ? "Habilidad de curación" : "Heal skill", hint: isEs ? "Enfriamiento entre curaciones." : "Cooldown between heals." },
    { key: "buff", label: isEs ? "Habilidad de mejora (Buff)" : "Buff skill", hint: isEs ? "Enfriamiento entre potenciadores." : "Cooldown between buffs." },
    { key: "trap", label: isEs ? "Habilidad de trampa" : "Trap skill", hint: isEs ? "Enfriamiento entre colocación de trampas." : "Cooldown between trap placement." },
    { key: "warp", label: isEs ? "Habilidad de teletransporte / warp" : "Warp skill", hint: isEs ? "Enfriamiento entre desplazamientos rápidos." : "Cooldown between warps." }
  ];

  for (const f of skillFields) {
    const row = el("div", { class: "bot-ai-slider-row" });
    const lbl = el("div", { class: "bot-ai-param-label" });
    lbl.appendChild(el("span", { class: "bot-ai-param-title" }, f.label));
    lbl.appendChild(el("span", { class: "bot-ai-param-hint" }, f.hint));
    row.appendChild(lbl);

    const numInput = el("input", {
      type: "number",
      class: "bot-ai-num-input",
      min: "0.5",
      max: "30.0",
      step: "0.5",
      value: String(profile.skillIntervals[f.key]),
      "aria-label": f.label
    });
    numInput.addEventListener("input", function () {
      const val = parseFloat(numInput.value);
      if (!isNaN(val) && val > 0) {
        setBotAiField(curMode, curKid, "skillIntervals", f.key, val);
      }
    });

    row.appendChild(numInput);
    skillGroup.appendChild(row);
  }
  advBody.appendChild(skillGroup);

  // Mode-specific deposits & combat toggles
  const miscGroup = el("div", { class: "bot-ai-param-group" });
  miscGroup.appendChild(el("h4", { style: "margin:0 0 10px; font-size:13px; color:var(--accent);" },
    isEs ? "🎮 Reglas de Modo y Combate" : "🎮 Mode Rules & Combat"));

  if (curMode !== "FlagFlight") {
    const rowDep = el("div", { class: "bot-ai-slider-row" });
    const lblDep = el("div", { class: "bot-ai-param-label" });
    lblDep.appendChild(el("span", { class: "bot-ai-param-title" }, isEs ? "Cristales para depositar" : "Crystals to deposit"));
    lblDep.appendChild(el("span", { class: "bot-ai-param-hint" }, isEs ? "Cantidad de cristales requeridos para ir al guardián." : "Number of crystals required before moving to guardian."));
    rowDep.appendChild(lblDep);

    const depInput = el("input", {
      type: "number",
      class: "bot-ai-num-input",
      min: "1",
      max: "10",
      step: "1",
      value: String(profile.scoreToDeposit || 5),
      "aria-label": isEs ? "Cristales para depositar" : "Crystals to deposit"
    });
    depInput.addEventListener("input", function () {
      const val = parseInt(depInput.value, 10);
      if (!isNaN(val) && val >= 1 && val <= 10) {
        setBotAiField(curMode, curKid, null, "scoreToDeposit", val);
      }
    });
    rowDep.appendChild(depInput);
    miscGroup.appendChild(rowDep);
  }

  // Lock-on checkbox
  const rowLock = el("div", { class: "bot-ai-slider-row" });
  const lblLock = el("div", { class: "bot-ai-param-label" });
  lblLock.appendChild(el("span", { class: "bot-ai-param-title" }, isEs ? "Permitir fijar blanco (Lock-on)" : "Allow lock-on"));
  lblLock.appendChild(el("span", { class: "bot-ai-param-hint" }, isEs ? "Permite al bot fijar la mira al combatir o usar habilidades dirigidas." : "Allows bot to acquire target locks during combat and targeted skill usage."));
  rowLock.appendChild(lblLock);

  const lockCheck = el("input", {
    type: "checkbox",
    "aria-label": isEs ? "Permitir fijar blanco" : "Allow lock-on"
  });
  lockCheck.checked = profile.canLockon !== false;
  lockCheck.addEventListener("change", function () {
    setBotAiField(curMode, curKid, null, "canLockon", lockCheck.checked);
  });
  rowLock.appendChild(lockCheck);
  miscGroup.appendChild(rowLock);

  advBody.appendChild(miscGroup);

  // Technical Native Parameters (Readonly Low HP 35% preserved)
  const rawGroup = el("div", { class: "bot-ai-param-group" });
  rawGroup.appendChild(el("h4", { style: "margin:0 0 10px; font-size:13px; color:var(--accent);" },
    isEs ? "⚙️ Parámetros Técnicos Nativos" : "⚙️ Native Technical Parameters"));
  const rawGrid = el("div", { class: "bot-ai-raw-grid" });
  rawGrid.appendChild(el("div", null, (isEs ? "Identificador de parámetro: " : "Parameter ID: ") + profile.parameterId));
  rawGrid.appendChild(el("div", null, (isEs ? "Kicker ID: " : "Kicker ID: ") + profile.kickerId));
  rawGrid.appendChild(el("div", null, (isEs ? "Disfraz ID: " : "Costume ID: ") + profile.kickerCostumeId));
  rawGrid.appendChild(el("div", null, (isEs ? "Rango: " : "Rank: ") + profile.rank));
  rawGrid.appendChild(el("div", null, (isEs ? "Umbral huida vida baja (constante nativa 35%): " : "Low HP retreat threshold (native 35% constant): ") + (Math.round((profile.lowHpDepositThreshold || 0.35) * 100)) + "%"));
  rawGroup.appendChild(rawGrid);
  rawGroup.appendChild(el("p", { class: "note", style: "margin-top:8px;" },
    isEs ? "Nota técnica: El umbral de huida por vida baja está preservado en 35% como constante nativa del cliente."
         : "Technical note: The low HP retreat threshold is preserved at 35% as a native client constant."));
  advBody.appendChild(rawGroup);

  advDetails.appendChild(advBody);
  container.appendChild(advDetails);

  // 6. Persistent Bottom Action Bar
  const dirtyCount = Object.keys(state.botAi.drafts).length;
  const actionBar = el("div", { class: "bot-ai-action-bar" });

  const leftActions = el("div", { style: "display:flex; align-items:center; gap:10px;" });
  const discardBtn = el("button", {
    type: "button",
    id: "botAiDiscardBtn",
    class: "bot-ai-btn danger"
  }, BalanceI18n.t("botAi.discardDraft"));
  discardBtn.disabled = !isDirty;
  discardBtn.addEventListener("click", function () {
    discardBotAiDraft(curMode, curKid);
  });
  leftActions.appendChild(discardBtn);
  actionBar.appendChild(leftActions);

  const rightActions = el("div", { style: "display:flex; align-items:center; gap:12px;" });
  if (dirtyCount > 0) {
    rightActions.appendChild(el("span", { style: "font-size:12px; color:var(--dirty); font-weight:600;" },
      BalanceI18n.t("botAi.reviewSave") + " (" + dirtyCount + ")"));
  }
  const saveLabel = state.botAi.saving ? BalanceI18n.t("common.saving")
    : BalanceI18n.t("botAi.saveBtn") + (dirtyCount > 0 ? " (" + dirtyCount + ")" : "");
  const saveBtn = el("button", {
    type: "button",
    id: "botAiSaveBtn",
    class: "bot-ai-btn primary"
  }, saveLabel);
  saveBtn.disabled = dirtyCount === 0 || state.botAi.saving;
  saveBtn.addEventListener("click", function () {
    showBotAiReviewModal();
  });
  rightActions.appendChild(saveBtn);
  actionBar.appendChild(rightActions);

  container.appendChild(actionBar);
  panel.appendChild(container);
}

/* -------------------------------------------------------------------- boot */

function syncLanguage() {
  const activeEl = document.activeElement;
  let activeFieldKey = null;
  let activeCursorStart = null;
  let activeCursorEnd = null;
  if (activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA" || activeEl.tagName === "SELECT")) {
    if (activeEl.dataset && activeEl.dataset.table && activeEl.dataset.rowId && activeEl.dataset.field) {
      activeFieldKey = fieldKey(activeEl.dataset.table, activeEl.dataset.rowId, activeEl.dataset.field);
      if (typeof activeEl.selectionStart === "number") {
        activeCursorStart = activeEl.selectionStart;
        activeCursorEnd = activeEl.selectionEnd;
      }
    }
  }

  const lang = BalanceI18n.getLang();
  document.documentElement.lang = lang;
  document.title = BalanceI18n.t("header.title");
  const select = document.getElementById("langSelect");
  if (select) select.value = lang;

  BalanceI18n.applyTranslations(document);

  const topHint = document.getElementById("topHint");
  if (topHint) {
    if (state.tab === "bot-ai") {
      topHint.textContent = BalanceI18n.t("header.topHintBotAi");
    } else {
      topHint.innerHTML = BalanceI18n.t("header.topHintMasters");
    }
  }

  if (state.currentUser) {
    const userEl = document.getElementById("currentUser");
    if (userEl) userEl.textContent = BalanceI18n.t("header.currentUser", { user: state.currentUser });
  }

  refreshDirty();
  buildDiscFilters();
  renderList();

  if (state.tab === "bot-ai") {
    if (state.botAi.loaded) {
      const panel = document.getElementById("panel");
      if (panel) renderBotAiPanel(panel);
      if (document.getElementById("botAiReviewModal")) {
        showBotAiReviewModal();
      }
      const conflictModal = document.getElementById("botAiConflictModal");
      if (conflictModal) {
        const head = conflictModal.querySelector(".bot-ai-modal-head span");
        if (head) head.textContent = BalanceI18n.t("botAi.conflictModalHead");
        const cancelBtn = conflictModal.querySelector(".bot-ai-modal-foot button.secondary");
        if (cancelBtn) cancelBtn.textContent = BalanceI18n.t("botAi.conflictModalClose");
        const reloadBtn = conflictModal.querySelector(".bot-ai-modal-foot button.primary");
        if (reloadBtn) reloadBtn.textContent = BalanceI18n.t("botAi.conflictModalReload");
      }
    }
  } else if (state.tab === "maintenance") {
    const startsAt = document.getElementById("maintStartsAt");
    const endsAt = document.getElementById("maintEndsAt");
    const notice = document.getElementById("maintNotice");
    const selectedMode = document.querySelector("input[name='maintMode']:checked");
    const saved = {
      startsAt: startsAt ? startsAt.value : null,
      endsAt: endsAt ? endsAt.value : null,
      notice: notice ? notice.value : null,
      mode: selectedMode ? selectedMode.value : null
    };
    renderPanel();
    if (saved.startsAt !== null && document.getElementById("maintStartsAt")) document.getElementById("maintStartsAt").value = saved.startsAt;
    if (saved.endsAt !== null && document.getElementById("maintEndsAt")) document.getElementById("maintEndsAt").value = saved.endsAt;
    if (saved.notice !== null && document.getElementById("maintNotice")) document.getElementById("maintNotice").value = saved.notice;
    if (saved.mode !== null) {
      const r = document.querySelector("input[name='maintMode'][value='" + saved.mode + "']");
      if (r) r.checked = true;
    }
  } else if (state.tab === "client-update") {
    const androidMin = document.getElementById("updateAndroidMin");
    const androidStore = document.getElementById("updateAndroidStore");
    const androidForce = document.getElementById("updateAndroidForce");
    const iosMin = document.getElementById("updateIosMin");
    const iosStore = document.getElementById("updateIosStore");
    const iosForce = document.getElementById("updateIosForce");
    const saved = {
      androidMin: androidMin ? androidMin.value : null,
      androidStore: androidStore ? androidStore.value : null,
      androidForce: androidForce ? androidForce.checked : null,
      iosMin: iosMin ? iosMin.value : null,
      iosStore: iosStore ? iosStore.value : null,
      iosForce: iosForce ? iosForce.checked : null
    };
    renderPanel();
    if (saved.androidMin !== null && document.getElementById("updateAndroidMin")) document.getElementById("updateAndroidMin").value = saved.androidMin;
    if (saved.androidStore !== null && document.getElementById("updateAndroidStore")) document.getElementById("updateAndroidStore").value = saved.androidStore;
    if (saved.androidForce !== null && document.getElementById("updateAndroidForce")) document.getElementById("updateAndroidForce").checked = saved.androidForce;
    if (saved.iosMin !== null && document.getElementById("updateIosMin")) document.getElementById("updateIosMin").value = saved.iosMin;
    if (saved.iosStore !== null && document.getElementById("updateIosStore")) document.getElementById("updateIosStore").value = saved.iosStore;
    if (saved.iosForce !== null && document.getElementById("updateIosForce")) document.getElementById("updateIosForce").checked = saved.iosForce;
  } else if (state.tab === "latest-information") {
    const titleIn = document.getElementById("latestInfoTitle");
    const textIn = document.getElementById("latestInfoAnnouncement");
    const urlIn = document.getElementById("latestInfoExternalUrl");
    const modeIn = document.querySelector("input[name='latestInfoMode']:checked");
    const saved = {
      title: titleIn ? titleIn.value : null,
      text: textIn ? textIn.value : null,
      url: urlIn ? urlIn.value : null,
      mode: modeIn ? modeIn.value : null
    };
    renderPanel();
    if (saved.title !== null && document.getElementById("latestInfoTitle")) document.getElementById("latestInfoTitle").value = saved.title;
    if (saved.text !== null && document.getElementById("latestInfoAnnouncement")) document.getElementById("latestInfoAnnouncement").value = saved.text;
    if (saved.url !== null && document.getElementById("latestInfoExternalUrl")) document.getElementById("latestInfoExternalUrl").value = saved.url;
    if (saved.mode !== null) {
      const r = document.querySelector("input[name='latestInfoMode'][value='" + saved.mode + "']");
      if (r) r.checked = true;
    }
  } else {
    renderPanel();
  }

  // Restore active element focus in tables
  if (activeFieldKey && state.inputs.has(activeFieldKey)) {
    const input = state.inputs.get(activeFieldKey);
    if (input && typeof input.focus === "function") {
      input.focus();
      if (activeCursorStart !== null && typeof input.setSelectionRange === "function") {
        try { input.setSelectionRange(activeCursorStart, activeCursorEnd); } catch (ignored) {}
      }
    }
  }
}

function wireEvents() {
  const langSelect = document.getElementById("langSelect");
  if (langSelect) {
    langSelect.addEventListener("change", function (e) {
      BalanceI18n.setLang(e.target.value);
      syncLanguage();
    });
  }
  BalanceI18n.onLangChange(function () {
    syncLanguage();
  });

  const tabs = document.querySelectorAll("#tabs button");
  for (const button of tabs) {
    button.addEventListener("click", function () {
      state.tab = button.dataset.tab;
      for (const other of tabs) other.classList.toggle("on", other === button);
      if (state.tab === "client-update") loadClientUpdate().then(renderPanel);
      document.getElementById("filters").style.display =
        state.tab === "maintenance" || state.tab === "client-update" || state.tab === "latest-information" || state.tab === "health" || state.tab === "bot-ai" ? "none" : "flex";
      document.getElementById("discFilters").style.display =
        state.tab === "discs" ? "block" : "none";
      const foot = document.getElementById("foot");
      if (foot) {
        foot.style.display = (state.tab === "kickers" || state.tab === "discs" || state.tab === "text") ? "block" : "none";
      }
      document.body.classList.toggle("tab-bot-ai", state.tab === "bot-ai");
      const topHint = document.getElementById("topHint");
      if (topHint) {
        if (state.tab === "bot-ai") {
          topHint.textContent = BalanceI18n.t("header.topHintBotAi");
        } else {
          topHint.innerHTML = BalanceI18n.t("header.topHintMasters");
        }
      }
      if (state.tab === "bot-ai" && !state.botAi.loaded && !state.botAi.loading) {
        loadBotAiProfiles();
      }
      renderList();
      renderPanel();
      refreshDirty();
    });
  }
  document.getElementById("filterText").addEventListener("input", renderList);
  document.getElementById("filterRarity").addEventListener("change", renderList);
  document.getElementById("filterType").addEventListener("change", renderList);
  document.getElementById("save").addEventListener("click", save);
  document.getElementById("revert").addEventListener("click", revert);
  document.getElementById("apply").addEventListener("click", applyNow);
  document.getElementById("exportOverrides").addEventListener("click", function () {
    window.location.href = balanceUrl("/api/overrides/export");
  });
  document.getElementById("logout").addEventListener("click", async function () {
    try {
      await fetchJSON("/api/logout", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    } finally {
      window.location.replace(balanceUrl("/login"));
    }
  });
  window.addEventListener("keydown", function (event) {
    if ((event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === "s") {
      event.preventDefault();
      save();
    }
  });
}

async function boot() {
  wireEvents();
  syncLanguage();
  try {
    const session = await fetchJSON("/api/session", { cache: "no-store" });
    state.currentUser = session.username;
    document.getElementById("currentUser").textContent = BalanceI18n.t("header.currentUser", { user: session.username });
    const loaded = await Promise.all([
      fetchJSON("/api/kickers", { cache: "no-store" }),
      fetchJSON("/api/discs", { cache: "no-store" })
    ]);
    state.kickers = loaded[0];
    state.discs = loaded[1];
    await loadEverything(false);
    try { state.layout = await fetchJSON("/api/layout", { cache: "no-store" }); } catch (error) { state.layout = []; }
    try {
      const schema = await fetchJSON("/api/effect-schema", { cache: "no-store" });
      state.effectSchema = (schema && schema.tables) || {};
    } catch (error) { state.effectSchema = {}; }
    try {
      const enums = await fetchJSON("/api/enums", { cache: "no-store" });
      state.enums = {
        enums: (enums && enums.enums) || {},
        fields: (enums && enums.fields) || {}
      };
    } catch (error) { state.enums = { enums: {}, fields: {} }; }
    await loadOverrides();
    await loadApplyStatus();
    await loadMaintenance();
    await loadLatestInformation();
    await loadHealth();
    buildScreens();
    buildDiscFilters();
    renderList();
    renderPanel();
    refreshDirty();
  } catch (error) {
    clear(document.getElementById("panel"));
    document.getElementById("panel").appendChild(el("p", { class: "empty" },
      "could not reach the balance server: " + error.message +
      " — start it with: python tools/balance/server.py"));
    setStatus([["err", "startup failed: " + error.message]]);
  }
}

boot();
</script>
</body>
</html>
